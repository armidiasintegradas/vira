<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="bg-grad-2" cx="60%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4A3718" />
      <stop offset="40%" stop-color="#222B27" />
      <stop offset="100%" stop-color="#111617" />
    </radialGradient>
    <linearGradient id="sun-beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD07A" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#C68D2B" stop-opacity="0.1" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="50" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg-grad-2)" />

  <!-- Solar Rays -->
  <g opacity="0.25">
    <polygon points="1200,-100 800,1200 950,1200 1350,-100" fill="url(#sun-beam)" />
    <polygon points="1400,-100 1100,1200 1280,1200 1580,-100" fill="url(#sun-beam)" />
    <polygon points="1000,-100 500,1200 620,1200 1120,-100" fill="url(#sun-beam)" />
  </g>

  <!-- Big Solar Disc -->
  <circle cx="1400" cy="280" r="280" fill="#C68D2B" opacity="0.35" filter="url(#glow2)" />

  <!-- Industrial Engineering Grid Lines -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1">
    <line x1="0" y1="300" x2="1920" y2="300" />
    <line x1="0" y1="550" x2="1920" y2="550" />
    <line x1="0" y1="800" x2="1920" y2="800" />
    <line x1="400" y1="0" x2="400" y2="1080" />
    <line x1="960" y1="0" x2="960" y2="1080" />
    <line x1="1520" y1="0" x2="1520" y2="1080" />
  </g>

  <!-- Architectural Modern Monolith Structure -->
  <g transform="translate(850, 480)">
    <!-- Isometric Industrial Pavilion -->
    <polygon points="-300,120 0,-60 300,120 0,300" fill="#2A3233" opacity="0.85" />
    <polygon points="0,-60 300,120 300,-180 0,-360" fill="#4A7135" opacity="0.55" />
    <polygon points="-300,120 0,-60 0,-360 -300,-180" fill="#385926" opacity="0.75" />
    
    <!-- Solar Roof Pattern -->
    <g stroke="#C68D2B" stroke-width="1.5" opacity="0.6">
      <line x1="-200" y1="-20" x2="100" y2="-200" />
      <line x1="-150" y1="20" x2="150" y2="-160" />
      <line x1="-100" y1="60" x2="200" y2="-120" />
    </g>
  </g>

  <text x="100" y="980" font-family="'JetBrains Mono', monospace" font-size="14" fill="rgba(255,255,255,0.4)" letter-spacing="4">
    FASE 02 • MATRIZ SOLAR & ESCALA FABRIL • +1.200 T/MÊS
  </text>
</svg>