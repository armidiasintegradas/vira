<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="bg-grad-1" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#3A4E31" />
      <stop offset="50%" stop-color="#1F2824" />
      <stop offset="100%" stop-color="#14191A" />
    </radialGradient>
    <linearGradient id="gold-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5B25D" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#C68D2B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#4A7135" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="prism-grad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#698E3C" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#C68D2B" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#2A3233" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Atmospheric Background -->
  <rect width="1920" height="1080" fill="url(#bg-grad-1)" />

  <!-- Subtle Topographic Iso Lines (Caruaru Landscape) -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1.5" fill="none">
    <path d="M-200 900 Q 400 600, 960 750 T 2120 400" />
    <path d="M-200 800 Q 500 500, 1100 650 T 2120 300" />
    <path d="M-200 700 Q 600 400, 1200 550 T 2120 200" />
    <path d="M-200 1000 Q 300 700, 900 850 T 2120 500" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="1350" cy="350" r="380" fill="#C68D2B" opacity="0.22" filter="url(#glow)" />
  <circle cx="550" cy="650" r="420" fill="#4A7135" opacity="0.25" filter="url(#glow)" />

  <!-- Central Dynamic Metamorphosis Sculptural Elements -->
  <g transform="translate(960, 520) scale(1.1)">
    <!-- Floating Circular Rings of Transformation -->
    <ellipse cx="0" cy="0" rx="540" ry="220" fill="none" stroke="url(#gold-light)" stroke-width="2.5" transform="rotate(-22)" opacity="0.6" />
    <ellipse cx="0" cy="0" rx="440" ry="180" fill="none" stroke="rgba(105, 142, 60, 0.4)" stroke-width="1.5" transform="rotate(18)" />
    <ellipse cx="0" cy="0" rx="320" ry="130" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" transform="rotate(-45)" />

    <!-- Sculptural Faceted Geometry (The Polymeric Transformation) -->
    <polygon points="-120,-240 180,-180 260,120 40,280 -200,160 -180,-80" fill="url(#prism-grad)" opacity="0.35" />
    <polygon points="-80,-200 150,-140 220,90 20,220 -160,120 -140,-60" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2" />
    
    <!-- Central Organic Leaf & Delta Motif -->
    <path d="M0,-160 C80,-80 140,40 0,160 C-140,40 -80,-80 0,-160 Z" fill="url(#gold-light)" opacity="0.75" />
    <polygon points="0,-90 65,50 -65,50" fill="#FEFDF9" opacity="0.9" />
  </g>

  <!-- Luminous Particulate Field -->
  <g fill="#E5B25D">
    <circle cx="420" cy="280" r="3" opacity="0.7" />
    <circle cx="780" cy="180" r="2" opacity="0.5" />
    <circle cx="1480" cy="220" r="4" opacity="0.8" />
    <circle cx="1620" cy="480" r="2.5" opacity="0.6" />
    <circle cx="340" cy="740" r="3.5" opacity="0.6" />
    <circle cx="890" cy="820" r="2" opacity="0.4" />
    <circle cx="1240" cy="790" r="3" opacity="0.7" />
  </g>

  <!-- Clean Editorial Typography Watermark -->
  <text x="100" y="980" font-family="'JetBrains Mono', monospace" font-size="14" fill="rgba(255,255,255,0.4)" letter-spacing="4">
    FASE 01 • A METAMORFOSE DA MATÉRIA • 8°22′S 35°58′W
  </text>
</svg>