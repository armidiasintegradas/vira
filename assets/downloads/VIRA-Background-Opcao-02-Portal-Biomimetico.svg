<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 2000" width="1200" height="2000">
  <defs>
    <radialGradient id="sky-glow-2" cx="50%" cy="48%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FEFCF6" />
      <stop offset="75%" stop-color="#E3E8DF" />
      <stop offset="100%" stop-color="#C7D0C2" />
    </radialGradient>
    <linearGradient id="silo-grad-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18201E" />
      <stop offset="60%" stop-color="#304325" />
      <stop offset="100%" stop-color="#507A38" />
    </linearGradient>
    <linearGradient id="silo-grad-r" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2425" />
      <stop offset="60%" stop-color="#42341D" />
      <stop offset="100%" stop-color="#B88226" />
    </linearGradient>
  </defs>

  <rect width="1200" height="2000" fill="url(#sky-glow-2)" />

  <!-- Luminous Atmospheric Fog -->
  <circle cx="600" cy="950" r="480" fill="#FFFFFF" opacity="0.8" filter="blur(70px)" />

  <!-- Left Architectural Silos & Nature Fusion -->
  <g>
    <!-- Silo 1 -->
    <path d="M-50,2000 L250,2000 L320,1000 L240,400 L80,0 L-50,0 Z" fill="url(#silo-grad-l)" opacity="0.95" />
    <path d="M-20,1800 L180,1800 L240,1100 L180,600 L80,100 L-20,100 Z" fill="#1B221E" opacity="0.7" />
    <!-- Overhanging Tree Branches -->
    <path d="M0,200 Q 280,450 360,700 Q 180,850 320,1150 Q 150,1350 40,1650 L0,1800 Z" fill="#2A3A23" opacity="0.85" />
    <path d="M0,0 Q 360,280 430,550 Q 260,700 380,950 L0,1100 Z" fill="#4A7135" opacity="0.6" />
  </g>

  <!-- Right Architectural Silos & Solar Rigging -->
  <g>
    <!-- Silo 2 -->
    <path d="M1250,2000 L950,2000 L880,1000 L960,400 L1120,0 L1250,0 Z" fill="url(#silo-grad-r)" opacity="0.95" />
    <path d="M1220,1800 L1020,1800 L960,1100 L1020,600 L1120,100 L1220,100 Z" fill="#1B2223" opacity="0.7" />
    <!-- Overhanging Organic Branches -->
    <path d="M1200,200 Q 920,450 840,700 Q 1020,850 880,1150 Q 1050,1350 1160,1650 L1200,1800 Z" fill="#2A3233" opacity="0.85" />
    <path d="M1200,0 Q 840,280 770,550 Q 940,700 820,950 L1200,1100 Z" fill="#C68D2B" opacity="0.5" />
  </g>

  <!-- Top Inverted Vault (Worm's Eye Perspective) -->
  <path d="M0,0 Q 600,280 1200,0 Z" fill="#171E1B" opacity="0.9" />

  <!-- Center Ascending Symbol -->
  <g transform="translate(600, 940) scale(1.3)">
    <path d="M0,-5 C-40,-35 -90,-40 -120,-18 C-85,6 -40,2 0,-5 Z" fill="#2A3233" />
    <path d="M0,-5 C40,-35 90,-40 120,-18 C85,6 40,2 0,-5 Z" fill="#2A3233" />
    <polygon points="0,-24 6,-5 0,12 -6,-5" fill="#2A3233" />
    <polygon points="0,-10 6,2 -6,2" fill="#4A7135" />
  </g>
</svg>