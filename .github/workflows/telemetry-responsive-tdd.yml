name: Responsive telemetry TDD

on:
  push:
    branches:
      - feat/internal-pages-visual-unity
    paths:
      - '.github/workflows/telemetry-responsive-tdd.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/internal-pages-visual-unity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run responsive telemetry contract
        run: node --test tests/internal-pages-visual-unity.test.mjs
