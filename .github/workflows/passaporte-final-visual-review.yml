name: Passaporte final visual review
on:
  push:
    branches: [feat/internal-pages-visual-unity]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/internal-pages-visual-unity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium QA runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Render Passaporte DPP
        run: |
          set -euo pipefail
          mkdir -p passaporte-review
          python3 -m http.server 4173 >/tmp/passaporte-review.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          cat > passaporte-review.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const cases=[['desktop',1440,900],['tablet',1024,768],['mobile',390,844],['narrow',350,780]];
          for(const [name,width,height] of cases){
            const page=await browser.newPage({viewport:{width,height}});
            const errors=[]; page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:4173/passaporte.html',{waitUntil:'networkidle',timeout:30000});
            await page.waitForFunction(()=>document.documentElement.dataset.viraInternalReady==='true',null,{timeout:10000});
            const m=await page.evaluate(()=>{
              const q=s=>document.querySelector(s); const rect=el=>{const r=el?.getBoundingClientRect();return r?{x:r.x,y:r.y,width:r.width,height:r.height,right:r.right,bottom:r.bottom}:null};
              const hero=q('[data-purpose="hero-section"], [data-internal-hero="true"]');
              const trace=q('[data-purpose="traceability-cycle"]'); const arch=q('[data-purpose="dpp-architecture"]'); const terminal=q('[data-purpose="audit-terminal"]'); const marker=q('[data-purpose="physical-marker"]'); const calc=q('[data-purpose="impact-calculator"]'); const legal=q('[data-purpose="legal-matrix"]'); const faq=q('[data-purpose="dpp-faq"]'); const form=q('[data-purpose="specification-form-section"]'); const footer=q('[data-purpose="internal-footer"]');
              const terminalActions=[...terminal?.querySelectorAll('button,a')??[]].filter(el=>/SHA-256|CERTIFICADO|RBC/i.test(el.textContent||'' )).map(rect);
              const affordances=[...document.querySelectorAll('[data-purpose="audit-terminal"] .overflow-x-auto,[data-purpose="legal-matrix"] .overflow-x-auto')].map(el=>({clientWidth:el.clientWidth,scrollWidth:el.scrollWidth}));
              return {scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth,bodyKey:document.body.dataset.viraInternal,hero:rect(hero),heroHeading:rect(hero?.querySelector('.vira-hero-heading')),heroCopy:rect(hero?.querySelector('.vira-hero-copy')),trace:rect(trace),arch:rect(arch),terminal:rect(terminal),marker:rect(marker),calc:rect(calc),legal:rect(legal),faq:rect(faq),form:rect(form),footer:rect(footer),terminalActions,affordances};
            });
            console.log(name,JSON.stringify(m));
            if(errors.length) throw new Error(`${name}: ${errors.join(' | ')}`);
            await page.screenshot({path:`passaporte-review/passaporte-${name}-top.png`,fullPage:false});
            await page.screenshot({path:`passaporte-review/passaporte-${name}-full.png`,fullPage:true});
            if(name==='mobile'){
              for(const [key,sel] of [['terminal','[data-purpose="audit-terminal"]'],['legal','[data-purpose="legal-matrix"]'],['calc','[data-purpose="impact-calculator"]']]){
                const loc=page.locator(sel); if(await loc.count()){await loc.scrollIntoViewIfNeeded(); await page.waitForTimeout(250); await loc.screenshot({path:`passaporte-review/passaporte-mobile-${key}.png`});}
              }
            }
            await page.close();
          }
          await browser.close();
          EOF
          node passaporte-review.mjs
          rm -f passaporte-review.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: passaporte-final-visual-review
          path: passaporte-review/*.png
          retention-days: 1
      - name: Clean harness and publish clean head
        run: |
          set -euo pipefail
          rm -rf node_modules package-lock.json package.json passaporte-review passaporte-review.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/passaporte-final-visual-review.yml
          git commit -m "chore: clean Passaporte final visual review harness"
          git push origin HEAD:feat/internal-pages-visual-unity
          test -z "$(git status --porcelain)"
