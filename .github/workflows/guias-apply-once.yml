name: Apply Guias refinement once

on:
  push:
    branches:
      - feat/internal-pages-visual-unity
    paths:
      - .github/workflows/guias-apply-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/internal-pages-visual-unity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply scoped Guias refinement
        run: bash scripts/guias-refinement-apply.sh
      - name: Verify targeted contract before commit
        run: node --test tests/guias-page.test.mjs
      - name: Commit scoped refinement
        shell: bash
        run: |
          git config user.name 'armidiasintegradas'
          git config user.email 'armidiasintegradas@gmail.com'
          git add internal-pages.css
          if git diff --cached --quiet; then
            echo 'No CSS changes to commit'
            exit 0
          fi
          git commit -m 'style: refine Guias against Paver golden master'
          git push origin HEAD:feat/internal-pages-visual-unity
