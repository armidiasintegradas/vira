name: Internal pages responsive visual smoke one-shot

on:
  push:
    branches:
      - feat/internal-pages-visual-unity

permissions:
  contents: write

jobs:
  smoke:
    if: github.event.head_commit.message == 'test run responsive internal pages smoke'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/internal-pages-visual-unity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser harness
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run responsive visual smoke at desktop tablet and mobile
        run: node scripts/internal-pages-visual-smoke.mjs
      - name: Re-run complete static suite
        run: node --test tests/*.test.mjs
      - name: Remove one-shot visual QA tooling and push verified branch
        shell: bash
        run: |
          rm -f .github/workflows/internal-pages-visual-smoke-once.yml scripts/internal-pages-visual-smoke.mjs .internal-pages-visual-smoke
          rm -rf node_modules
          git config user.name "AR Mídias Integradas Automation"
          git config user.email "armidiasintegradas@users.noreply.github.com"
          git add -A
          git commit -m "test: verify responsive VIRA internal pages [skip ci]"
          git push origin HEAD:feat/internal-pages-visual-unity
