name: Guias mobile width GREEN

on:
  push:
    branches:
      - feat/internal-pages-visual-unity
    paths:
      - '.github/workflows/guias-mobile-width-green.yml'

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/internal-pages-visual-unity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply approved Guias mobile containment and remove harness
        run: |
          set -euo pipefail
          rm -f .github/workflows/guias-mobile-width-green.yml
          python3 - <<'PY'
          from pathlib import Path
          p = Path('internal-pages.css')
          css = p.read_text()
          marker = '/* Guias mobile hero width containment */'
          assert marker not in css, 'containment marker already exists unexpectedly'
          block = '''\n\n/* Guias mobile hero width containment */\n@media (max-width:639px) {\n  [data-vira-internal="guias"] [data-internal-hero="true"] > div.relative:not(.absolute) > .pointer-events-auto {\n    width:100%!important;\n    max-width:100%!important;\n    min-width:0!important;\n  }\n}\n'''
          p.write_text(css.rstrip() + block + '\n')
          PY
      - name: Verify targeted GREEN
        run: node --test tests/guias-page.test.mjs
      - name: Install Chromium QA runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify real mobile geometry at 390px and 350px
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/guias-width-green.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          cat > guias-width-green.mjs <<'EOF'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          const browser = await chromium.launch({ headless:true });
          for (const width of [390,350]) {
            const page = await browser.newPage({ viewport:{ width, height:844 } });
            await page.goto('http://127.0.0.1:4173/guias.html', { waitUntil:'networkidle' });
            await page.waitForFunction(() => document.documentElement.dataset.viraInternalReady === 'true');
            const data = await page.evaluate(() => {
              const hero = document.querySelector('[data-internal-hero="true"]');
              const outer = hero.querySelector('div.relative:not(.absolute)');
              const content = outer.querySelector(':scope > .pointer-events-auto');
              const kicker = hero.querySelector('.vira-hero-kicker');
              const h1 = hero.querySelector('.vira-hero-heading');
              const copy = hero.querySelector('.vira-hero-copy');
              const rect = el => { const r=el.getBoundingClientRect(); return {left:r.left,right:r.right,width:r.width}; };
              return {
                viewport: innerWidth,
                hero: {...rect(hero), scrollWidth:hero.scrollWidth, clientWidth:hero.clientWidth},
                outer: rect(outer),
                content: rect(content),
                kicker: rect(kicker),
                h1: rect(h1),
                copy: rect(copy),
              };
            });
            const available = data.outer.width - 32;
            assert(data.content.width <= available + 1, `${width}px: content width ${data.content.width} > available ${available}`);
            assert(data.content.right <= width - 15, `${width}px: content right ${data.content.right} clipped`);
            assert(data.h1.right <= width - 15, `${width}px: h1 clipped at ${data.h1.right}`);
            assert(data.copy.right <= width - 15, `${width}px: copy clipped at ${data.copy.right}`);
            assert(data.kicker.right <= width - 15, `${width}px: kicker clipped at ${data.kicker.right}`);
            assert(data.hero.scrollWidth <= data.hero.clientWidth + 1, `${width}px: hero internal overflow ${data.hero.scrollWidth}/${data.hero.clientWidth}`);
            console.log(`Guias ${width}px geometry: ok`, JSON.stringify(data));
            await page.close();
          }
          await browser.close();
          EOF
          node guias-width-green.mjs
          rm -f guias-width-green.mjs
      - name: Verify complete static suite
        run: node --test tests/*.test.mjs
      - name: Publish verified product fix
        run: |
          set -euo pipefail
          rm -rf node_modules package-lock.json package.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: contain Guias hero content on mobile"
          git push origin HEAD:feat/internal-pages-visual-unity
          test -z "$(git status --porcelain)"
