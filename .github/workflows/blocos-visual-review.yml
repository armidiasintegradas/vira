name: Blocos visual review

on:
  push:
    branches:
      - feat/internal-pages-visual-unity
    paths:
      - '.github/workflows/blocos-visual-review.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/internal-pages-visual-unity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture Blocos at approved viewports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-review
          python3 -m http.server 4173 >/tmp/vira-blocos-review-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          cat > /tmp/blocos-review.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const cases = [
            ['desktop',1440,900],
            ['tablet',1024,768],
            ['mobile',390,844],
          ];
          for (const [name,width,height] of cases) {
            const page = await browser.newPage({viewport:{width,height}, deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:4173/blocos.html',{waitUntil:'networkidle',timeout:30000});
            await page.waitForFunction(() => document.documentElement.dataset.viraInternalReady === 'true', null, {timeout:10000});
            await page.evaluate(() => document.fonts?.ready);
            await page.waitForTimeout(700);
            await page.screenshot({path:`visual-review/blocos-${name}-full.png`,fullPage:true});
            await page.screenshot({path:`visual-review/blocos-${name}-top.png`,fullPage:false});
            const metrics = await page.evaluate(() => ({
              width: innerWidth,
              height: innerHeight,
              scrollWidth: document.documentElement.scrollWidth,
              scrollHeight: document.documentElement.scrollHeight,
              h1: document.querySelector('h1')?.getBoundingClientRect().toJSON(),
              telemetry: document.querySelector('[data-purpose="telemetry-bar"]')?.getBoundingClientRect().toJSON(),
              header: document.querySelector('[data-purpose="primary-navigation"]')?.getBoundingClientRect().toJSON(),
              hero: document.querySelector('[data-internal-hero="true"]')?.getBoundingClientRect().toJSON(),
              footer: document.querySelector('[data-purpose="internal-footer"]')?.getBoundingClientRect().toJSON(),
              bodyKey: document.body.dataset.viraInternal,
              ready: document.documentElement.dataset.viraInternalReady,
            }));
            console.log(name, JSON.stringify(metrics));
            if (errors.length) console.log(name,'pageErrors',JSON.stringify(errors));
            await page.close();
          }
          await browser.close();
          EOF
          node /tmp/blocos-review.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: blocos-visual-review
          path: visual-review/
          if-no-files-found: error
          retention-days: 1
