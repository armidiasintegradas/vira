name: Final Paver verification one-shot

on:
  push:
    branches:
      - feat/internal-pages-visual-unity

permissions:
  contents: write

jobs:
  verify-final-tree:
    if: "${{ github.event.head_commit.message == 'test: final Paver verification' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/internal-pages-visual-unity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser harness
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify feature tree before cleanup
        shell: bash
        run: |
          node --test tests/*.test.mjs
          mkdir -p scripts
          git show 3eeac51386d29d6706b562ded364e4b0b4a031a6:scripts/internal-pages-visual-smoke.mjs > scripts/internal-pages-visual-smoke.mjs
          node scripts/internal-pages-visual-smoke.mjs
          rm -f scripts/internal-pages-visual-smoke.mjs
      - name: Create clean final commit
        shell: bash
        run: |
          rm -f .github/workflows/final-paver-verify-once.yml
          git config user.name "AR Mídias Integradas Automation"
          git config user.email "armidiasintegradas@users.noreply.github.com"
          git add .github/workflows/final-paver-verify-once.yml
          git commit -m "chore: remove final Paver verification [skip ci]"
      - name: Verify exact final commit
        shell: bash
        run: |
          node --test tests/*.test.mjs
          mkdir -p scripts
          git show 3eeac51386d29d6706b562ded364e4b0b4a031a6:scripts/internal-pages-visual-smoke.mjs > scripts/internal-pages-visual-smoke.mjs
          node scripts/internal-pages-visual-smoke.mjs
          rm -f scripts/internal-pages-visual-smoke.mjs
          rm -rf node_modules package-lock.json
          test -z "$(git status --porcelain)"
      - name: Push verified final commit
        run: git push origin HEAD:feat/internal-pages-visual-unity
