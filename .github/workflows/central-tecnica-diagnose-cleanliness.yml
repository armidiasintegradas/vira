name: Diagnose Central Tecnica QA cleanliness

on:
  push:
    branches:
      - feat/internal-pages-visual-unity
    paths:
      - .github/workflows/central-tecnica-diagnose-cleanliness.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/internal-pages-visual-unity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Status before browser harness install
        run: |
          echo '=== BEFORE ==='
          git status --porcelain=v1 --untracked-files=all || true
      - name: Reproduce browser harness install
        run: npm install --no-save playwright@1.55.0
      - name: Status after browser harness install
        run: |
          echo '=== AFTER NPM INSTALL ==='
          git status --porcelain=v1 --untracked-files=all || true
          echo '=== ROOT GENERATED FILES ==='
          ls -la package*.json node_modules 2>/dev/null || true
