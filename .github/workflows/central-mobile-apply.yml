name: Central mobile apply
on:
  push:
    branches: [feat/internal-pages-visual-unity]
permissions:
  contents: write
jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'test apply Central mobile refinement' }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/internal-pages-visual-unity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply approved Central mobile refinement
        shell: bash
        run: |
          set -euo pipefail
          cat >> internal-pages.css <<'EOF'

          /* Central Tecnica mobile refinement — visual review */
          @media (min-width:360px) and (max-width:639px) {
            [data-vira-internal="central-tecnica"] [data-purpose="central-hero"] > div.relative > div.grid:last-child {
              grid-template-columns:repeat(2,minmax(0,1fr))!important;
            }
          }

          @media (max-width:639px) {
            [data-vira-internal="central-tecnica"] [data-purpose="regulatory-matrix"] .overflow-x-auto {
              position:relative;
              padding-top:26px;
              isolation:isolate;
            }

            [data-vira-internal="central-tecnica"] [data-purpose="regulatory-matrix"] .overflow-x-auto::before {
              content:"DESLIZE →";
              position:absolute;
              z-index:4;
              top:0;
              right:2px;
              padding:3px 7px;
              border:1px solid rgba(8,17,13,.16);
              border-radius:999px;
              background:rgba(250,249,246,.94);
              color:var(--vira-dark);
              font-family:"IBM Plex Mono",monospace;
              font-size:9px;
              line-height:1.2;
              font-weight:700;
              letter-spacing:.08em;
              pointer-events:none;
            }

            [data-vira-internal="central-tecnica"] [data-purpose="regulatory-matrix"] .overflow-x-auto::after {
              content:"";
              position:absolute;
              z-index:3;
              top:26px;
              right:0;
              bottom:0;
              width:38px;
              background:linear-gradient(to left,rgba(250,249,246,.96),rgba(250,249,246,0));
              pointer-events:none;
            }

            [data-vira-internal="central-tecnica"] [data-purpose="document-library"] .doc-card > div:last-child {
              width:100%;
              flex-direction:column;
              align-items:stretch!important;
              gap:10px!important;
            }

            [data-vira-internal="central-tecnica"] [data-purpose="document-library"] .doc-card > div:last-child > button {
              width:100%;
              min-height:44px;
              justify-content:center;
            }

            [data-vira-internal="central-tecnica"] [data-purpose="document-library"] .doc-card > div:last-child > span {
              align-self:flex-start;
            }
          }
          EOF
          node --test tests/central-tecnica.test.mjs
          git config user.name 'armidiasintegradas'
          git config user.email 'armidiasintegradas@gmail.com'
          git add internal-pages.css
          git commit -m 'fix: refine Central Tecnica mobile layout'
          git push origin HEAD:feat/internal-pages-visual-unity
