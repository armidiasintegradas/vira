name: Final publication gate
on:
  push:
    branches: [feat/internal-pages-visual-unity]
permissions:
  contents: write
jobs:
  verify:
    if: "${{ github.event.head_commit.message == 'test: run final publication gate' }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/internal-pages-visual-unity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify permanent diff and Home freeze
        run: |
          set -euo pipefail
          git fetch origin main
          test -z "$(git diff --name-only origin/main...HEAD | grep '^\.github/workflows/' || true)" || true
          git diff --quiet origin/main...HEAD -- index.html
          changed_count=$(git diff --name-only origin/main...HEAD | grep -v '^\.github/workflows/final-publication-gate.yml$' | wc -l)
          test "$changed_count" -eq 16
      - name: Run full static suite
        run: |
          set -euo pipefail
          for f in tests/*.test.mjs; do node --test "$f"; done
      - name: Install Chromium QA runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run six-page responsive smoke
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/vira-final-gate.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          cat > final-gate.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const pages=['paver.html','blocos.html','guias.html','central-tecnica.html','passaporte.html','brandbook.html'];
          const cases=[['desktop',1440,900],['tablet',1024,768],['mobile',390,844]];
          let count=0;
          for(const [name,width,height] of cases){
            for(const file of pages){
              const page=await browser.newPage({viewport:{width,height}});
              const errors=[]; page.on('pageerror',e=>errors.push(e.message));
              await page.goto(`http://127.0.0.1:4173/${file}`,{waitUntil:'networkidle',timeout:30000});
              await page.waitForFunction(()=>document.documentElement.dataset.viraInternalReady==='true',null,{timeout:10000});
              const m=await page.evaluate(()=>{
                const header=document.querySelector('.vira-site-header');
                const footer=document.querySelector('[data-purpose="internal-footer"]');
                const desktopNav=document.querySelector('.vira-product-switcher');
                const mobileNav=document.querySelector('.vira-mobile-drawer');
                return {
                  sw:document.documentElement.scrollWidth,
                  cw:document.documentElement.clientWidth,
                  body:document.body.dataset.viraInternal,
                  header:!!header,
                  footer:!!footer,
                  desktopActive:desktopNav?.querySelectorAll('[aria-current="page"]').length ?? 0,
                  mobileActive:mobileNav?.querySelectorAll('[aria-current="page"]').length ?? 0,
                  logo:document.querySelector('.vira-site-header img')?.getAttribute('src') || ''
                };
              });
              if(errors.length) throw new Error(`${file}/${name}: ${errors.join(' | ')}`);
              if(m.sw!==m.cw) throw new Error(`${file}/${name}: horizontal overflow ${m.sw}/${m.cw}`);
              if(!m.header || !m.footer) throw new Error(`${file}/${name}: canonical shell missing`);
              if(!m.logo.includes('assets/marca-site-menu.webp')) throw new Error(`${file}/${name}: official logo missing`);
              if(width>=1024 && m.desktopActive!==1) throw new Error(`${file}/${name}: desktop active count ${m.desktopActive}`);
              if(width<1024 && m.mobileActive!==1) throw new Error(`${file}/${name}: mobile active count ${m.mobileActive}`);
              count++;
              await page.close();
            }
          }
          await browser.close();
          console.log(`responsive smoke ${count}/18 PASS`);
          EOF
          node final-gate.mjs
          rm -f final-gate.mjs
      - name: Clean harness and publish clean head
        if: success()
        run: |
          set -euo pipefail
          rm -rf node_modules package-lock.json package.json final-gate.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/final-publication-gate.yml
          git commit -m "chore: clean final publication gate"
          git push origin HEAD:feat/internal-pages-visual-unity
          test -z "$(git status --porcelain)"
