name: Central mobile RED
on:
  push:
    branches: [feat/internal-pages-visual-unity]
jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/internal-pages-visual-unity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove Central mobile contract is RED
        run: node --test tests/central-tecnica.test.mjs
