name: Brandbook refinement TDD

on:
  push:
    branches:
      - feat/internal-pages-visual-unity
    paths:
      - 'brandbook.html'
      - 'internal-pages.css'
      - 'tests/brandbook-page.test.mjs'
      - '.github/workflows/brandbook-refinement-tdd.yml'

jobs:
  brandbook-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/internal-pages-visual-unity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Brandbook contract
        run: node --test tests/brandbook-page.test.mjs
