name: Central mobile final verification
on:
  push:
    branches: [feat/internal-pages-visual-unity]
permissions:
  contents: write
jobs:
  finalize:
    if: "${{ github.event.head_commit.message == 'test run Central mobile final verification' }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/internal-pages-visual-unity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create clean final commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'armidiasintegradas'
          git config user.email 'armidiasintegradas@gmail.com'
          git rm -f .github/workflows/central-mobile-red.yml
          git rm -f .github/workflows/central-mobile-apply.yml
          git rm -f .github/workflows/central-mobile-finalize.yml
          git commit -m 'chore: clean Central mobile QA harness'
      - name: Verify Central targeted contract on clean commit
        run: node --test tests/central-tecnica.test.mjs
      - name: Run complete static suite on clean commit
        run: node --test tests/*.test.mjs
      - name: Install browser harness
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify Central responsive geometry and six-page smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts visual-review
          python3 -m http.server 4173 >/tmp/vira-central-mobile-final.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          cat > scripts/central-mobile-final.mjs <<'EOF'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const browser = await chromium.launch({headless:true});
          const cases = [
            ['desktop',1440,900,4],
            ['tablet',1024,768,4],
            ['tablet-edge',768,768,2],
            ['mobile',390,844,2],
            ['narrow',350,780,1],
          ];

          for (const [name,width,height,expectedColumns] of cases) {
            const page = await browser.newPage({viewport:{width,height}});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:4173/central-tecnica.html',{waitUntil:'networkidle',timeout:30000});
            await page.waitForFunction(() => document.documentElement.dataset.viraInternalReady === 'true', null, {timeout:10000});
            const state = await page.evaluate(() => {
              const grid = document.querySelector('[data-purpose="central-hero"] > div.relative > div.grid:last-child');
              const tableScroll = document.querySelector('[data-purpose="regulatory-matrix"] .overflow-x-auto');
              const actionGroup = document.querySelector('[data-purpose="document-library"] .doc-card > div:last-child');
              const actionButton = actionGroup?.querySelector('button');
              const groupRect = actionGroup?.getBoundingClientRect();
              const buttonRect = actionButton?.getBoundingClientRect();
              return {
                columns: grid ? getComputedStyle(grid).gridTemplateColumns.split(/\s+/).filter(Boolean).length : 0,
                noHorizontalOverflow: document.documentElement.scrollWidth <= innerWidth,
                beforeContent: tableScroll ? getComputedStyle(tableScroll,'::before').content : null,
                afterBackground: tableScroll ? getComputedStyle(tableScroll,'::after').backgroundImage : null,
                actionDirection: actionGroup ? getComputedStyle(actionGroup).flexDirection : null,
                groupWidth: groupRect?.width ?? 0,
                buttonWidth: buttonRect?.width ?? 0,
                buttonHeight: buttonRect?.height ?? 0,
              };
            });
            assert.equal(state.columns, expectedColumns, `${name}: grade do hero incorreta`);
            assert(state.noHorizontalOverflow, `${name}: overflow horizontal global detectado`);
            if (width <= 639) {
              assert(state.beforeContent?.includes('DESLIZE'), `${name}: indicador DESLIZE ausente`);
              assert(state.afterBackground?.includes('linear-gradient'), `${name}: fade lateral ausente`);
              assert.equal(state.actionDirection,'column',`${name}: ações documentais não estão empilhadas`);
              assert(state.buttonHeight >= 44,`${name}: botão documental abaixo de 44px`);
              assert(state.buttonWidth >= state.groupWidth - 1,`${name}: botão documental não ocupa a largura disponível`);
            }
            if (name === 'mobile') {
              await page.screenshot({path:'visual-review/central-mobile-after.png',fullPage:true});
            }
            assert.equal(errors.length,0,`${name}: page errors: ${errors.join(' | ')}`);
            console.log(`central ${name}: ok`, JSON.stringify(state));
            await page.close();
          }

          const pages=['paver.html','blocos.html','guias.html','central-tecnica.html','passaporte.html','brandbook.html'];
          const viewports=[['desktop',1440,900],['tablet',1024,768],['mobile',390,844]];
          for (const [label,width,height] of viewports) {
            let reference=null;
            for (const file of pages) {
              const page=await browser.newPage({viewport:{width,height}});
              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              await page.goto(`http://127.0.0.1:4173/${file}`,{waitUntil:'networkidle',timeout:30000});
              await page.waitForFunction(() => document.documentElement.dataset.viraInternalReady === 'true', null, {timeout:10000});
              const state=await page.evaluate(()=>{
                const h=document.querySelector('[data-purpose="primary-navigation"]')?.getBoundingClientRect();
                return {scrollWidth:document.documentElement.scrollWidth,innerWidth,header:h?{top:h.top,height:h.height,width:h.width}:null};
              });
              assert(state.header,`${label}/${file}: header ausente`);
              assert(state.scrollWidth<=state.innerWidth,`${label}/${file}: overflow horizontal`);
              assert.equal(errors.length,0,`${label}/${file}: page errors: ${errors.join(' | ')}`);
              if (!reference) reference=state.header;
              else {
                assert.equal(state.header.top,reference.top,`${label}/${file}: top do header divergente`);
                assert.equal(state.header.height,reference.height,`${label}/${file}: altura do header divergente`);
                assert.equal(state.header.width,reference.width,`${label}/${file}: largura do header divergente`);
              }
              console.log(`visual-smoke ${label}/${file}: ok`);
              await page.close();
            }
            console.log(`visual-smoke ${label}: shared header geometry consistent`);
          }
          await browser.close();
          console.log('Central responsive mobile refinement and internal-pages smoke: ok');
          EOF
          node scripts/central-mobile-final.mjs
          rm -f scripts/central-mobile-final.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: central-mobile-after
          path: visual-review/central-mobile-after.png
          retention-days: 1
          if-no-files-found: error
      - name: Clean browser artifacts and confirm working tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules visual-review
          rmdir scripts 2>/dev/null || true
          test -z "$(git status --porcelain)"
      - name: Push clean final commit
        run: git push origin HEAD:feat/internal-pages-visual-unity
