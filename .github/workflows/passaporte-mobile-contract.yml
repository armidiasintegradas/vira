name: Passaporte mobile contract

on:
  push:
    branches:
      - feat/internal-pages-visual-unity
    paths:
      - '.github/workflows/passaporte-mobile-contract.yml'
      - 'tests/passaporte.test.mjs'
      - 'internal-pages.css'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/internal-pages-visual-unity
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Passaporte contract
        run: node --test tests/passaporte.test.mjs
