name: Apply Brandbook refinement once

on:
  push:
    branches:
      - feat/internal-pages-visual-unity
    paths:
      - '.github/workflows/brandbook-apply-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/internal-pages-visual-unity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply approved Brandbook refinement
        run: |
          python3 scripts/brandbook-refinement-apply.py
          python3 scripts/brandbook-refinement-selector-fix.py
      - name: Verify targeted contract is green
        run: node --test tests/brandbook-page.test.mjs
      - name: Commit approved Brandbook refinement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'armidiasintegradas'
          git config user.email 'armidiasintegradas@gmail.com'
          git add brandbook.html internal-pages.css
          git commit -m 'feat: refine Brandbook visual system'
          git push origin HEAD:feat/internal-pages-visual-unity
