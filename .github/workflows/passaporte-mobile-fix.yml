name: Passaporte mobile selector fix

on:
  push:
    branches:
      - feat/internal-pages-visual-unity
    paths:
      - '.github/workflows/passaporte-mobile-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/internal-pages-visual-unity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Correct approved technical-table target
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('internal-pages.css')
          text=path.read_text(encoding='utf-8')
          marker='/* Passaporte DPP mobile refinement — visual review */'
          assert marker in text
          head, tail = text.split(marker,1)
          old='[data-vira-internal="passaporte"] [data-purpose="dpp-architecture"] .overflow-x-auto'
          new='[data-vira-internal="passaporte"] [data-purpose="audit-terminal"] .overflow-x-auto'
          count=tail.count(old)
          assert count == 5, f'expected 5 scoped selector occurrences, found {count}'
          tail=tail.replace(old,new)
          path.write_text(head+marker+tail,encoding='utf-8')
          PY
          node --test tests/passaporte.test.mjs
          git config user.name 'armidiasintegradas'
          git config user.email 'armidiasintegradas@gmail.com'
          git add internal-pages.css
          git commit -m 'fix: target Passaporte audit terminal table'
          git push origin HEAD:feat/internal-pages-visual-unity
