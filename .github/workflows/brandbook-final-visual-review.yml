name: Brandbook final visual review
on:
  push:
    branches: [feat/internal-pages-visual-unity]
permissions:
  contents: write
jobs:
  review:
    if: "${{ startsWith(github.event.head_commit.message, 'test: rerun Brandbook visual review') }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/internal-pages-visual-unity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium QA runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Render Brandbook
        run: |
          set -euo pipefail
          mkdir -p brandbook-review
          python3 -m http.server 4173 >/tmp/brandbook-review.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          cat > brandbook-review.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const base='http://127.0.0.1:4173/brandbook.html';
          const cases=[['desktop',1440,900],['tablet',1024,768],['mobile',390,844],['narrow',350,780]];
          for(const [name,width,height] of cases){
            const page=await browser.newPage({viewport:{width,height}});
            const errors=[]; page.on('pageerror',e=>errors.push(e.message));
            await page.goto(base,{waitUntil:'networkidle',timeout:30000});
            await page.waitForFunction(()=>document.documentElement.dataset.viraInternalReady==='true',null,{timeout:10000});
            const m=await page.evaluate(()=>{
              const q=s=>document.querySelector(s); const rect=el=>{const r=el?.getBoundingClientRect();return r?{x:r.x,y:r.y,width:r.width,height:r.height,right:r.right,bottom:r.bottom}:null};
              const hero=q('[data-purpose="brandbook-hero"], [data-internal-hero="true"]');
              const chapters=q('[data-purpose="brandbook-chapter-nav"]');
              const typo=q('[data-purpose="brand-typography"]');
              const signage=q('[data-purpose="brand-signage"]');
              const uniforms=q('[data-purpose="brand-uniforms"]');
              const downloads=q('[data-purpose="brand-downloads"]');
              const footer=q('[data-purpose="internal-footer"]');
              const chapterLinks=[...chapters?.querySelectorAll('a[href^="#"]')??[]].map(a=>({href:a.getAttribute('href'),text:a.textContent.trim()}));
              const overflowEls=[...document.querySelectorAll('*')].filter(el=>el.scrollWidth>el.clientWidth+1 && getComputedStyle(el).overflowX!=='visible').slice(0,20).map(el=>({tag:el.tagName,cls:el.className,clientWidth:el.clientWidth,scrollWidth:el.scrollWidth}));
              return {scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth,bodyKey:document.body.dataset.viraInternal,chapters:rect(chapters),hero:rect(hero),heroHeading:rect(hero?.querySelector('.vira-hero-heading')),heroCopy:rect(hero?.querySelector('.vira-hero-copy')),typo:rect(typo),signage:rect(signage),uniforms:rect(uniforms),downloads:rect(downloads),footer:rect(footer),chapterLinks,overflowEls};
            });
            console.log(name,JSON.stringify(m));
            if(errors.length) throw new Error(`${name}: ${errors.join(' | ')}`);
            await page.screenshot({path:`brandbook-review/brandbook-${name}-top.png`,fullPage:false});
            await page.screenshot({path:`brandbook-review/brandbook-${name}-full.png`,fullPage:true});
            if(name==='mobile'){
              for(const [key,sel] of [['chapters','[data-purpose="brandbook-chapter-nav"]'],['typography','[data-purpose="brand-typography"]'],['downloads','[data-purpose="brand-downloads"]']]){
                const loc=page.locator(sel); if(await loc.count()){await loc.scrollIntoViewIfNeeded(); await page.waitForTimeout(250); await loc.screenshot({path:`brandbook-review/brandbook-mobile-${key}.png`});}
              }
              for(const link of m.chapterLinks){
                await page.goto(base,{waitUntil:'networkidle'});
                await page.waitForFunction(()=>document.documentElement.dataset.viraInternalReady==='true',null,{timeout:10000});
                await page.locator(`[data-purpose="brandbook-chapter-nav"] a[href="${link.href}"]`).click();
                await page.waitForTimeout(550);
                const anchor=await page.evaluate(href=>{const el=document.querySelector(href); const r=el?.getBoundingClientRect(); return r?{top:r.top,height:r.height}:null;},link.href);
                console.log('anchor',link.href,JSON.stringify(anchor));
                if(!anchor || anchor.top<120) throw new Error(`anchor hidden ${link.href}: ${JSON.stringify(anchor)}`);
              }
            }
            await page.close();
          }
          await browser.close();
          EOF
          node brandbook-review.mjs
          rm -f brandbook-review.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: brandbook-final-visual-review
          path: brandbook-review/*.png
          retention-days: 1
      - name: Clean harness and publish clean head
        run: |
          set -euo pipefail
          rm -rf node_modules package-lock.json package.json brandbook-review brandbook-review.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/brandbook-final-visual-review.yml
          git commit -m "chore: clean Brandbook final visual review harness"
          git push origin HEAD:feat/internal-pages-visual-unity
          test -z "$(git status --porcelain)"
