name: Finalize responsive telemetry verification

on:
  push:
    branches:
      - feat/internal-pages-visual-unity
    paths:
      - '.github/workflows/telemetry-responsive-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/internal-pages-visual-unity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create clean final commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'armidiasintegradas'
          git config user.email 'armidiasintegradas@gmail.com'
          git rm -f .github/workflows/telemetry-responsive-tdd.yml
          git rm -f .github/workflows/telemetry-responsive-apply.yml
          git rm -f .github/workflows/telemetry-responsive-finalize.yml
          git commit -m 'chore: clean responsive telemetry QA harness'
      - name: Verify responsive telemetry contract on clean commit
        run: node --test tests/internal-pages-visual-unity.test.mjs
      - name: Run complete static suite on clean commit
        run: node --test tests/*.test.mjs
      - name: Install browser harness
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify telemetry geometry at responsive breakpoints
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/vira-telemetry-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          mkdir -p scripts
          cat > scripts/telemetry-responsive-verify.mjs <<'EOF'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const browser = await chromium.launch({headless:true});
          const cases = [
            ['desktop',1440,900,{group:true,long:true,short:false}],
            ['tablet',1024,768,{group:false,long:true,short:false}],
            ['tablet-edge',768,768,{group:false,long:true,short:false}],
            ['mobile',390,844,{group:false,long:false,short:true}],
          ];

          for (const [name,width,height,expected] of cases) {
            const page = await browser.newPage({viewport:{width,height}});
            await page.goto('http://127.0.0.1:4173/paver.html',{waitUntil:'networkidle'});
            const state = await page.evaluate(() => {
              const visible = el => !!el && getComputedStyle(el).display !== 'none' && el.getBoundingClientRect().width > 0;
              const group = document.querySelector('.vira-telemetry__group');
              const long = document.querySelector('.vira-telemetry__ok--long');
              const short = document.querySelector('.vira-telemetry__ok--short');
              const cta = document.querySelector('.vira-telemetry__cta');
              const telemetry = document.querySelector('[data-purpose="telemetry-bar"]');
              const longBox = long?.getBoundingClientRect();
              const shortBox = short?.getBoundingClientRect();
              const ctaBox = cta?.getBoundingClientRect();
              const activeBox = visible(short) ? shortBox : longBox;
              return {
                group: visible(group),
                long: visible(long),
                short: visible(short),
                noHorizontalOverflow: document.documentElement.scrollWidth <= window.innerWidth,
                telemetryWithinViewport: telemetry.getBoundingClientRect().right <= window.innerWidth + 0.5,
                statusDoesNotOverlapCta: !activeBox || !ctaBox || activeBox.right <= ctaBox.left + 0.5,
              };
            });
            assert.equal(state.group, expected.group, `${name}: visibilidade da normativa`);
            assert.equal(state.long, expected.long, `${name}: visibilidade do status longo`);
            assert.equal(state.short, expected.short, `${name}: visibilidade do status curto`);
            assert(state.noHorizontalOverflow, `${name}: overflow horizontal detectado`);
            assert(state.telemetryWithinViewport, `${name}: telemetria excede viewport`);
            assert(state.statusDoesNotOverlapCta, `${name}: status colide com CTA`);
            console.log(`telemetry ${name}: ok`);
            await page.close();
          }
          await browser.close();
          console.log('responsive telemetry geometry: ok');
          EOF
          node scripts/telemetry-responsive-verify.mjs
          rm -f scripts/telemetry-responsive-verify.mjs
      - name: Run six-page responsive smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts
          git show 3eeac51386d29d6706b562ded364e4b0b4a031a6:scripts/internal-pages-visual-smoke.mjs > scripts/internal-pages-visual-smoke.mjs
          node scripts/internal-pages-visual-smoke.mjs
          rm -f scripts/internal-pages-visual-smoke.mjs
      - name: Remove temporary browser harness
        run: rm -rf node_modules
      - name: Confirm clean working tree and push
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git push origin HEAD:feat/internal-pages-visual-unity
