name: Apply responsive telemetry fix

on:
  push:
    branches:
      - feat/internal-pages-visual-unity
    paths:
      - '.github/workflows/telemetry-responsive-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/internal-pages-visual-unity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply responsive telemetry CSS
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('internal-pages.css')
          css = path.read_text(encoding='utf-8')

          old = '.vira-telemetry__ok { color:#34d399; font-weight:600; white-space:nowrap; }\n.vira-telemetry__cta'
          new = '.vira-telemetry__ok { color:#34d399; font-weight:600; white-space:nowrap; }\n.vira-telemetry__ok--short { display:none; }\n.vira-telemetry__cta'
          if old not in css:
              raise SystemExit('status selector anchor not found')
          css = css.replace(old, new, 1)

          old = '@media (max-width:1279px) {\n  .vira-product-switcher { display:none; }'
          new = '@media (max-width:1279px) {\n  .vira-telemetry__group { display:none; }\n  .vira-telemetry__status { width:100%; justify-content:space-between; }\n  .vira-product-switcher { display:none; }'
          if old not in css:
              raise SystemExit('tablet media anchor not found')
          css = css.replace(old, new, 1)

          old = '  .vira-telemetry__ok { font-size:9px; overflow:hidden; text-overflow:ellipsis; }\n  .vira-telemetry__cta { font-size:9px; }'
          new = '  .vira-telemetry__ok { font-size:9px; overflow:hidden; text-overflow:ellipsis; }\n  .vira-telemetry__ok--long { display:none; }\n  .vira-telemetry__ok--short { display:inline; }\n  .vira-telemetry__cta { font-size:9px; }'
          if old not in css:
              raise SystemExit('mobile status anchor not found')
          css = css.replace(old, new, 1)

          path.write_text(css, encoding='utf-8')
          PY
      - name: Verify targeted contract is green
        run: node --test tests/internal-pages-visual-unity.test.mjs
      - name: Commit CSS fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'armidiasintegradas'
          git config user.email 'armidiasintegradas@gmail.com'
          git add internal-pages.css
          git commit -m 'fix: prevent telemetry collision on tablet'
          git push origin HEAD:feat/internal-pages-visual-unity
