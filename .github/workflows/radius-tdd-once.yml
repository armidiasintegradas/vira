name: Radius scale TDD one-shot

on:
  push:
    branches:
      - feat/internal-pages-visual-unity
    paths:
      - tests/internal-pages-visual-unity.test.mjs
      - internal-pages.css
      - .radius-tdd-trigger

permissions:
  contents: read

jobs:
  radius-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/internal-pages-visual-unity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run internal pages visual unity contract
        run: node --test tests/internal-pages-visual-unity.test.mjs
