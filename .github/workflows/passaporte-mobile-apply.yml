name: Passaporte mobile apply

on:
  push:
    branches:
      - feat/internal-pages-visual-unity
    paths:
      - '.github/workflows/passaporte-mobile-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/internal-pages-visual-unity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply approved Passaporte mobile refinement
        shell: bash
        run: |
          set -euo pipefail
          cat >> internal-pages.css <<'EOF'

          /* Passaporte DPP mobile refinement — visual review */
          @media (min-width:360px) and (max-width:639px) {
            [data-vira-internal="passaporte"] [data-purpose="hero-section"] [data-purpose="compliance-badges"] {
              grid-template-columns:repeat(2,minmax(0,1fr))!important;
            }
          }

          @media (max-width:639px) {
            [data-vira-internal="passaporte"] [data-purpose="dpp-architecture"] .overflow-x-auto,
            [data-vira-internal="passaporte"] [data-purpose="legal-matrix"] .overflow-x-auto {
              position:relative;
              padding-top:28px;
            }

            [data-vira-internal="passaporte"] [data-purpose="dpp-architecture"] .overflow-x-auto::before,
            [data-vira-internal="passaporte"] [data-purpose="legal-matrix"] .overflow-x-auto::before {
              content:"DESLIZE →";
              position:absolute;
              z-index:4;
              top:0;
              right:2px;
              padding:3px 7px;
              border-radius:999px;
              font-family:"IBM Plex Mono",monospace;
              font-size:9px;
              line-height:1.2;
              font-weight:700;
              letter-spacing:.08em;
              pointer-events:none;
            }

            [data-vira-internal="passaporte"] [data-purpose="dpp-architecture"] .overflow-x-auto::before {
              border:1px solid rgba(241,197,70,.28);
              background:rgba(8,17,13,.88);
              color:var(--vira-gold);
            }

            [data-vira-internal="passaporte"] [data-purpose="legal-matrix"] .overflow-x-auto::before {
              border:1px solid rgba(8,17,13,.16);
              background:rgba(250,249,246,.94);
              color:var(--vira-dark);
            }

            [data-vira-internal="passaporte"] [data-purpose="dpp-architecture"] .overflow-x-auto::after,
            [data-vira-internal="passaporte"] [data-purpose="legal-matrix"] .overflow-x-auto::after {
              content:"";
              position:absolute;
              z-index:3;
              top:26px;
              right:0;
              bottom:0;
              width:38px;
              pointer-events:none;
            }

            [data-vira-internal="passaporte"] [data-purpose="dpp-architecture"] .overflow-x-auto::after {
              background:linear-gradient(to left,rgba(8,17,13,.96),rgba(8,17,13,0));
            }

            [data-vira-internal="passaporte"] [data-purpose="legal-matrix"] .overflow-x-auto::after {
              background:linear-gradient(to left,rgba(250,249,246,.96),rgba(250,249,246,0));
            }

            [data-vira-internal="passaporte"] [data-purpose="audit-terminal"] .flex.flex-wrap.items-center.gap-3.pt-4 {
              width:100%;
              flex-direction:column;
              align-items:stretch!important;
            }

            [data-vira-internal="passaporte"] [data-purpose="audit-terminal"] .flex.flex-wrap.items-center.gap-3.pt-4 > :where(button,a) {
              width:100%;
              min-height:44px;
              margin-left:0!important;
              justify-content:center;
              text-align:center;
            }
          }
          EOF
          node --test tests/passaporte.test.mjs
          git config user.name 'armidiasintegradas'
          git config user.email 'armidiasintegradas@gmail.com'
          git add internal-pages.css
          git commit -m 'feat: refine Passaporte mobile visual system'
          git push origin HEAD:feat/internal-pages-visual-unity
