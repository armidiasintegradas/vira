name: Paver radius verification one-shot

on:
  push:
    branches:
      - feat/internal-pages-visual-unity
    paths:
      - tests/internal-pages-visual-unity.test.mjs

permissions:
  contents: read

jobs:
  verify:
    if: "${{ github.event.head_commit.message == 'test: verify Paver radius responsive behavior' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/internal-pages-visual-unity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run complete static suite
        run: node --test tests/*.test.mjs
      - name: Install browser harness
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run proven responsive visual smoke against current branch
        run: |
          mkdir -p scripts
          git show 3eeac51386d29d6706b562ded364e4b0b4a031a6:scripts/internal-pages-visual-smoke.mjs > scripts/internal-pages-visual-smoke.mjs
          node scripts/internal-pages-visual-smoke.mjs
          rm -f scripts/internal-pages-visual-smoke.mjs
      - name: Verify canonical Paver radius contract
        run: node --test tests/internal-pages-visual-unity.test.mjs
