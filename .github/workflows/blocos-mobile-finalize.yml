name: Blocos mobile final verification

on:
  push:
    branches:
      - feat/internal-pages-visual-unity
    paths:
      - '.github/workflows/blocos-mobile-finalize.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/internal-pages-visual-unity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create clean final commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'armidiasintegradas'
          git config user.email 'armidiasintegradas@gmail.com'
          git rm -f .github/workflows/blocos-mobile-tdd.yml
          git rm -f .github/workflows/blocos-mobile-apply.yml
          git rm -f .github/workflows/blocos-mobile-finalize.yml
          git commit -m 'chore: clean Blocos mobile QA harness'
      - name: Verify Blocos targeted contract on clean commit
        run: node --test tests/blocos-page.test.mjs
      - name: Run complete static suite on clean commit
        run: node --test tests/*.test.mjs
      - name: Install browser harness
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify Blocos responsive geometry and visual affordance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts visual-review
          python3 -m http.server 4173 >/tmp/vira-blocos-mobile-final.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          cat > scripts/blocos-mobile-final.mjs <<'EOF'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const browser = await chromium.launch({headless:true});
          const cases = [
            ['desktop',1440,900,4],
            ['tablet',1024,768,4],
            ['tablet-edge',768,768,2],
            ['mobile',390,844,2],
            ['narrow',350,780,1],
          ];

          for (const [name,width,height,expectedColumns] of cases) {
            const page = await browser.newPage({viewport:{width,height}});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:4173/blocos.html',{waitUntil:'networkidle',timeout:30000});
            await page.waitForFunction(() => document.documentElement.dataset.viraInternalReady === 'true', null, {timeout:10000});
            const state = await page.evaluate(() => {
              const grid = document.querySelector('[data-internal-hero="true"] > div.relative:not(.absolute) > div.mt-12');
              const tableScroll = document.querySelector('.lg\\:col-span-7.overflow-x-auto');
              const columns = getComputedStyle(grid).gridTemplateColumns.split(/\s+/).filter(Boolean).length;
              return {
                columns,
                noHorizontalOverflow: document.documentElement.scrollWidth <= innerWidth,
                beforeContent: tableScroll ? getComputedStyle(tableScroll,'::before').content : null,
                afterBackground: tableScroll ? getComputedStyle(tableScroll,'::after').backgroundImage : null,
                heroHeight: document.querySelector('[data-internal-hero="true"]').getBoundingClientRect().height,
              };
            });
            assert.equal(state.columns, expectedColumns, `${name}: grade do hero incorreta`);
            assert(state.noHorizontalOverflow, `${name}: overflow horizontal global detectado`);
            if (width <= 639) {
              assert(state.beforeContent?.includes('DESLIZE'), `${name}: indicador DESLIZE ausente`);
              assert(state.afterBackground?.includes('linear-gradient'), `${name}: fade lateral ausente`);
            }
            if (name === 'mobile') {
              await page.screenshot({path:'visual-review/blocos-mobile-after.png',fullPage:true});
              assert(state.heroHeight < 1100, `mobile: hero ainda excessivamente alto (${state.heroHeight}px)`);
            }
            assert.equal(errors.length,0,`${name}: page errors: ${errors.join(' | ')}`);
            console.log(`blocos ${name}: ok`, JSON.stringify(state));
            await page.close();
          }
          await browser.close();
          console.log('Blocos responsive mobile refinement: ok');
          EOF
          node scripts/blocos-mobile-final.mjs
          rm -f scripts/blocos-mobile-final.mjs
      - name: Run six-page responsive smoke
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/internal-pages-final-smoke.mjs <<'EOF'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          const browser = await chromium.launch({headless:true});
          const pages=['paver.html','blocos.html','guias.html','central-tecnica.html','passaporte.html','brandbook.html'];
          const viewports=[['desktop',1440,900],['tablet',1024,768],['mobile',390,844]];
          for (const [label,width,height] of viewports) {
            let reference=null;
            for (const file of pages) {
              const page=await browser.newPage({viewport:{width,height}});
              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              await page.goto(`http://127.0.0.1:4173/${file}`,{waitUntil:'networkidle',timeout:30000});
              await page.waitForFunction(() => document.documentElement.dataset.viraInternalReady === 'true', null, {timeout:10000});
              const state=await page.evaluate(()=>{
                const h=document.querySelector('[data-purpose="primary-navigation"]')?.getBoundingClientRect();
                return {scrollWidth:document.documentElement.scrollWidth,innerWidth,header:h?{top:h.top,height:h.height,width:h.width}:null};
              });
              assert(state.header,`${label}/${file}: header ausente`);
              assert(state.scrollWidth<=state.innerWidth,`${label}/${file}: overflow horizontal`);
              assert.equal(errors.length,0,`${label}/${file}: page errors: ${errors.join(' | ')}`);
              if (!reference) reference=state.header;
              else {
                assert.equal(state.header.top,reference.top,`${label}/${file}: top do header divergente`);
                assert.equal(state.header.height,reference.height,`${label}/${file}: altura do header divergente`);
                assert.equal(state.header.width,reference.width,`${label}/${file}: largura do header divergente`);
              }
              console.log(`visual-smoke ${label}/${file}: ok`);
              await page.close();
            }
            console.log(`visual-smoke ${label}: shared header geometry consistent`);
          }
          await browser.close();
          console.log('internal-pages responsive visual smoke: ok');
          EOF
          node scripts/internal-pages-final-smoke.mjs
          rm -f scripts/internal-pages-final-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: blocos-mobile-after
          path: visual-review/blocos-mobile-after.png
          retention-days: 1
          if-no-files-found: error
      - name: Clean browser artifacts and confirm working tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules visual-review
          rmdir scripts 2>/dev/null || true
          test -z "$(git status --porcelain)"
      - name: Push clean final commit
        run: git push origin HEAD:feat/internal-pages-visual-unity
