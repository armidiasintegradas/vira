name: Brandbook visual review once

on:
  push:
    branches:
      - feat/internal-pages-visual-unity
    paths:
      - .github/workflows/brandbook-visual-review-once.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/internal-pages-visual-unity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Diagnose Brandbook anchors and mobile overflow
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/vira-brandbook-diagnose.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          cat > diagnose-brandbook.mjs <<'EOF'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const browser = await chromium.launch({headless:true});
          const cases=[['tablet',1024,768],['mobile',390,844]];
          const targets=['visao-geral','logotipo','cores','tipografia','sinalizacao','uniformes','downloads'];

          for (const [name,width,height] of cases) {
            const page=await browser.newPage({viewport:{width,height}});
            await page.goto('http://127.0.0.1:4173/brandbook.html',{waitUntil:'networkidle',timeout:30000});
            await page.waitForFunction(() => document.documentElement.dataset.viraInternalReady === 'true', null, {timeout:10000});

            const baseline=await page.evaluate(()=>{
              const nav=document.querySelector('[data-purpose="brandbook-chapter-nav"]');
              const typo=document.querySelector('[data-purpose="brand-typography"] .overflow-x-auto');
              return {
                chapterClientWidth:nav?.clientWidth ?? 0,
                chapterScrollWidth:nav?.scrollWidth ?? 0,
                typographyClientWidth:typo?.clientWidth ?? 0,
                typographyScrollWidth:typo?.scrollWidth ?? 0,
                typographyBefore:typo ? getComputedStyle(typo,'::before').content : null,
                typographyAfter:typo ? getComputedStyle(typo,'::after').backgroundImage : null,
              };
            });
            console.log(`${name} baseline`,JSON.stringify(baseline));

            for (const id of targets) {
              await page.locator(`[data-purpose="brandbook-chapter-nav"] a[href="#${id}"]`).click();
              await page.waitForTimeout(250);
              const state=await page.evaluate((targetId)=>{
                const target=document.getElementById(targetId);
                const chapter=document.querySelector('[data-purpose="brandbook-chapter-nav"]');
                const header=document.querySelector('[data-purpose="primary-navigation"]');
                const t=target?.getBoundingClientRect();
                const c=chapter?.getBoundingClientRect();
                const h=header?.getBoundingClientRect();
                const firstHeading=target?.querySelector('h1,h2,h3')?.getBoundingClientRect();
                return {
                  hash:location.hash,
                  targetTop:t?.top ?? null,
                  headingTop:firstHeading?.top ?? null,
                  chapterBottom:c?.bottom ?? null,
                  headerBottom:h?.bottom ?? null,
                  scrollY,
                };
              },id);
              console.log(`${name} #${id}`,JSON.stringify(state));
              assert.equal(state.hash,`#${id}`,`${name}/${id}: hash incorreto`);
              assert(state.headingTop !== null,`${name}/${id}: heading ausente`);
              assert(state.chapterBottom !== null,`${name}/${id}: chapter nav ausente`);
            }
            await page.close();
          }
          await browser.close();
          EOF
          node diagnose-brandbook.mjs
          rm -f diagnose-brandbook.mjs
