name: Brandbook visual review once

on:
  push:
    branches:
      - feat/internal-pages-visual-unity
    paths:
      - .github/workflows/brandbook-visual-review-once.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/internal-pages-visual-unity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify Brandbook chapter anchors
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/vira-brandbook-anchor.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          cat > verify-brandbook-anchor.mjs <<'EOF'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const browser=await chromium.launch({headless:true});
          const cases=[['tablet',1024,768],['mobile',390,844]];
          const targets=['visao-geral','logotipo','cores','tipografia','sinalizacao','uniformes','downloads'];
          for (const [name,width,height] of cases) {
            const page=await browser.newPage({viewport:{width,height}});
            await page.goto('http://127.0.0.1:4173/brandbook.html',{waitUntil:'networkidle',timeout:30000});
            await page.waitForFunction(() => document.documentElement.dataset.viraInternalReady === 'true', null, {timeout:10000});
            for (const id of targets) {
              await page.locator(`[data-purpose="brandbook-chapter-nav"] a[href="#${id}"]`).click();
              await page.waitForTimeout(1600);
              const s=await page.evaluate((targetId)=>{
                const target=document.getElementById(targetId);
                const chapter=document.querySelector('[data-purpose="brandbook-chapter-nav"]');
                const heading=target?.querySelector('h1,h2,h3');
                const t=target?.getBoundingClientRect();
                const c=chapter?.getBoundingClientRect();
                const h=heading?.getBoundingClientRect();
                return {hash:location.hash,targetTop:t?.top ?? null,headingTop:h?.top ?? null,chapterBottom:c?.bottom ?? null,scrollY};
              },id);
              console.log(`${name} #${id}`,JSON.stringify(s));
              assert.equal(s.hash,`#${id}`);
              assert(s.targetTop !== null && s.chapterBottom !== null && s.headingTop !== null);
              assert(s.headingTop >= s.chapterBottom,`${name}/${id}: heading coberto pela navegação sticky`);
            }
            await page.close();
          }
          await browser.close();
          EOF
          node verify-brandbook-anchor.mjs
          rm -f verify-brandbook-anchor.mjs
