name: Guias mobile RED
on:
  push:
    branches: [feat/internal-pages-visual-unity]
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/internal-pages-visual-unity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Expect Guias mobile contract to fail before implementation
        run: node --test tests/guias-page.test.mjs
