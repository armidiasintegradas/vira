name: Central final visual review
on:
  push:
    branches: [feat/internal-pages-visual-unity]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/internal-pages-visual-unity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium QA runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Render Central Técnica
        run: |
          set -euo pipefail
          mkdir -p central-review
          python3 -m http.server 4173 >/tmp/central-review.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          cat > central-review.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const cases = [
            ['desktop',1440,900],
            ['tablet',1024,768],
            ['mobile',390,844],
            ['narrow',350,780],
          ];
          for (const [name,width,height] of cases) {
            const page = await browser.newPage({viewport:{width,height}});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:4173/central-tecnica.html',{waitUntil:'networkidle',timeout:30000});
            await page.waitForFunction(()=>document.documentElement.dataset.viraInternalReady==='true',null,{timeout:10000});
            const m = await page.evaluate(()=>{
              const q=s=>document.querySelector(s);
              const rect=el=>{const r=el?.getBoundingClientRect();return r?{x:r.x,y:r.y,width:r.width,height:r.height,right:r.right,bottom:r.bottom}:null};
              const hero=q('[data-purpose="central-hero"], [data-internal-hero="true"]');
              const header=q('[data-purpose="primary-navigation"]');
              const telemetry=q('[data-purpose="telemetry-bar"]');
              const docs=q('[data-purpose="document-library"]');
              const matrix=q('[data-purpose="regulatory-matrix"]');
              const faq=q('[data-purpose="faq-section"]');
              const form=q('[data-purpose="specification-request"]');
              const footer=q('[data-purpose="internal-footer"]');
              return {
                scrollWidth:document.documentElement.scrollWidth,
                clientWidth:document.documentElement.clientWidth,
                bodyKey:document.body.dataset.viraInternal,
                hero:rect(hero), header:rect(header), telemetry:rect(telemetry), docs:rect(docs), matrix:rect(matrix), faq:rect(faq), form:rect(form), footer:rect(footer),
                heroHeading:rect(hero?.querySelector('.vira-hero-heading')),
                heroCopy:rect(hero?.querySelector('.vira-hero-copy')),
                heroKpis:[...hero?.querySelectorAll('.mt-12 > *')??[]].map(rect),
                matrixScroll: matrix ? {clientWidth:matrix.clientWidth,scrollWidth:matrix.scrollWidth} : null,
              };
            });
            console.log(name,JSON.stringify(m));
            if(errors.length) throw new Error(`${name}: ${errors.join(' | ')}`);
            await page.screenshot({path:`central-review/central-${name}-top.png`,fullPage:false});
            await page.screenshot({path:`central-review/central-${name}-full.png`,fullPage:true});
            await page.close();
          }
          await browser.close();
          EOF
          node central-review.mjs
          rm -f central-review.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: central-final-visual-review
          path: central-review/*.png
          retention-days: 1
      - name: Clean harness and publish clean head
        run: |
          set -euo pipefail
          rm -rf node_modules package-lock.json package.json central-review central-review.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/central-final-visual-review.yml
          git commit -m "chore: clean Central final visual review harness"
          git push origin HEAD:feat/internal-pages-visual-unity
          test -z "$(git status --porcelain)"
