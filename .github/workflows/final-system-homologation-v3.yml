name: Final system homologation v3

on:
  push:
    branches:
      - feat/internal-pages-visual-unity
    paths:
      - '.github/workflows/final-system-homologation-v3.yml'

permissions:
  contents: write

jobs:
  homologate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/internal-pages-visual-unity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove temporary homologation workflow and publish clean head
        run: |
          set -euo pipefail
          rm -f .github/workflows/final-system-homologation-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: clean final system homologation v3 harness"
          git push origin HEAD:feat/internal-pages-visual-unity
          test -z "$(git status --porcelain)"
      - name: Run complete static suite
        run: node --test tests/*.test.mjs
      - name: Install Chromium QA runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify six-page system contract, navigation and responsive shell
        run: |
          set -euo pipefail
          mkdir -p system-review-v3
          python3 -m http.server 4173 >/tmp/vira-final-system-v3.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          cat > final-system-review-v3.mjs <<'EOF'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          const browser = await chromium.launch({ headless:true });
          const routes = [
            ['paver','paver.html'],
            ['blocos','blocos.html'],
            ['guias','guias.html'],
            ['central-tecnica','central-tecnica.html'],
            ['passaporte','passaporte.html'],
            ['brandbook','brandbook.html'],
          ];
          const expectedRoutes = routes.map(([,route])=>route);
          const viewports = [['desktop',1440,900],['tablet',1024,768],['mobile',390,844]];
          let smokeCount=0;

          for (const [viewportName,width,height] of viewports) {
            let canonicalHeader=null, canonicalTelemetry=null, canonicalFooter=null;
            for (const [key,route] of routes) {
              const page=await browser.newPage({viewport:{width,height}});
              const pageErrors=[];
              page.on('pageerror',e=>pageErrors.push(e.message));
              await page.goto(`http://127.0.0.1:4173/${route}`,{waitUntil:'networkidle',timeout:30000});
              await page.waitForFunction(()=>document.documentElement.dataset.viraInternalReady==='true',null,{timeout:10000});
              const state=await page.evaluate(({key})=>{
                const header=document.querySelector('[data-purpose="primary-navigation"]');
                const telemetry=document.querySelector('[data-purpose="telemetry-bar"]');
                const footer=document.querySelector('[data-purpose="internal-footer"]');
                const desktopNav=header?.querySelector('.vira-product-switcher');
                const mobileDrawer=header?.querySelector('.vira-mobile-drawer');
                const menuToggle=header?.querySelector('.vira-menu-toggle');
                const rect=el=>{const r=el?.getBoundingClientRect();return r?{top:Math.round(r.top),width:Math.round(r.width),height:Math.round(r.height)}:null;};
                const desktopActive=[...(desktopNav?.querySelectorAll('a[aria-current="page"]')??[])];
                const mobileActive=[...(mobileDrawer?.querySelectorAll('a[aria-current="page"]')??[])];
                const footerActive=[...(footer?.querySelectorAll('a[aria-current="page"]')??[])];
                const config=window.VIRAInternalPages?.PAGE_CONFIG?.[key];
                return {
                  bodyKey:document.body.dataset.viraInternal,
                  ready:document.documentElement.dataset.viraInternalReady,
                  noOverflow:document.documentElement.scrollWidth<=innerWidth,
                  canonicalTelemetry:telemetry?.dataset.viraCanonical??null,
                  desktopActiveCount:desktopActive.length, desktopActiveHref:desktopActive[0]?.getAttribute('href')??null,
                  mobileActiveCount:mobileActive.length, mobileActiveHref:mobileActive[0]?.getAttribute('href')??null,
                  footerActiveCount:footerActive.length, footerActiveHref:footerActive[0]?.getAttribute('href')??null,
                  desktopRoutes:[...(desktopNav?.querySelectorAll('.vira-nav-link')??[])].map(a=>a.getAttribute('href')),
                  mobileRoutes:[...(mobileDrawer?.querySelectorAll('.vira-nav-link')??[])].map(a=>a.getAttribute('href')),
                  footerRoutes:[...(footer?.querySelectorAll('.vira-internal-footer__links a')??[])].map(a=>a.getAttribute('href')),
                  navRoutes:window.VIRAInternalPages?.NAV?.map(x=>x.route)??[],
                  headerLogo:header?.querySelector('.vira-brand__logo')?.getAttribute('src')??'',
                  footerLogo:footer?.querySelector('.vira-internal-footer__logo')?.getAttribute('src')??'',
                  headerCta:header?.querySelector('.vira-header-actions .vira-specify-cta')?.getAttribute('href')??'',
                  drawerCta:mobileDrawer?.querySelector('.vira-specify-cta')?.getAttribute('href')??'',
                  telemetryCta:telemetry?.querySelector('.vira-telemetry__cta')?.getAttribute('href')??'',
                  configCta:config?.cta??null,
                  localAnchorExists:config?.cta?.startsWith('#')?Boolean(document.querySelector(config.cta)):true,
                  footerCredit:footer?.textContent.includes('Desenvolvido por AR Mídias Integradas.')??false,
                  headerRect:rect(header), telemetryRect:rect(telemetry), footerRect:rect(footer),
                  desktopSwitcherVisible:desktopNav?getComputedStyle(desktopNav).display!=='none':false,
                  menuVisible:menuToggle?getComputedStyle(menuToggle).display!=='none':false,
                  drawerHidden:mobileDrawer?.getAttribute('aria-hidden')??null,
                };
              },{key});
              assert.equal(pageErrors.length,0,`${viewportName}/${route}: page errors ${pageErrors.join(' | ')}`);
              assert.equal(state.bodyKey,key,`${viewportName}/${route}: body key`);
              assert.equal(state.ready,'true',`${viewportName}/${route}: shell`);
              assert(state.noOverflow,`${viewportName}/${route}: global overflow`);
              assert.equal(state.canonicalTelemetry,'true',`${viewportName}/${route}: telemetry`);
              assert.equal(state.desktopActiveCount,1); assert.equal(state.desktopActiveHref,route);
              assert.equal(state.mobileActiveCount,1); assert.equal(state.mobileActiveHref,route);
              assert.equal(state.footerActiveCount,1); assert.equal(state.footerActiveHref,route);
              assert.deepEqual(state.desktopRoutes,expectedRoutes); assert.deepEqual(state.mobileRoutes,expectedRoutes); assert.deepEqual(state.footerRoutes,expectedRoutes); assert.deepEqual(state.navRoutes,expectedRoutes);
              assert(state.headerLogo.endsWith('assets/marca-site-menu.webp')); assert(state.footerLogo.endsWith('assets/marca-site-menu.webp'));
              assert.equal(state.headerCta,state.configCta); assert.equal(state.drawerCta,state.configCta); assert.equal(state.telemetryCta,state.configCta); assert(state.localAnchorExists); assert(state.footerCredit);
              if(!canonicalHeader) canonicalHeader=state.headerRect; else assert.deepEqual(state.headerRect,canonicalHeader);
              if(!canonicalTelemetry) canonicalTelemetry=state.telemetryRect; else assert.deepEqual(state.telemetryRect,canonicalTelemetry);
              if(!canonicalFooter) canonicalFooter=state.footerRect; else assert.deepEqual(state.footerRect,canonicalFooter);
              if(width>=1280){assert(state.desktopSwitcherVisible);assert(!state.menuVisible);} else {assert(!state.desktopSwitcherVisible);assert(state.menuVisible);assert.equal(state.drawerHidden,'true');}
              if(viewportName==='mobile'){
                const button=page.locator('.vira-menu-toggle'); const drawer=page.locator('.vira-mobile-drawer');
                await button.click(); assert.equal(await button.getAttribute('aria-expanded'),'true'); assert.equal(await drawer.getAttribute('aria-hidden'),'false');
                await page.keyboard.press('Escape'); assert.equal(await button.getAttribute('aria-expanded'),'false'); assert.equal(await drawer.getAttribute('aria-hidden'),'true');
              }
              if(viewportName==='desktop') await page.screenshot({path:`system-review-v3/${key}-desktop-top.png`,clip:{x:0,y:0,width,height:900}});
              if(viewportName==='mobile') await page.screenshot({path:`system-review-v3/${key}-mobile-top.png`,clip:{x:0,y:0,width,height:844}});
              smokeCount++; console.log(`system ${viewportName}/${route}: ok`); await page.close();
            }
          }
          assert.equal(smokeCount,18);

          for (const [mode,width,height,navSelector] of [['desktop',1440,900,'.vira-product-switcher'],['mobile',390,844,'.vira-mobile-drawer']]) {
            const page=await browser.newPage({viewport:{width,height}});
            await page.goto('http://127.0.0.1:4173/paver.html',{waitUntil:'networkidle'});
            await page.waitForFunction(()=>document.documentElement.dataset.viraInternalReady==='true');
            for (const [key,route] of routes.slice(1).concat([routes[0]])) {
              if(mode==='mobile') await page.locator('.vira-menu-toggle').click();
              await Promise.all([page.waitForURL(url=>url.pathname.endsWith(`/${route}`),{timeout:10000}),page.locator(`${navSelector} a[href="${route}"]`).click()]);
              await page.waitForFunction(()=>document.documentElement.dataset.viraInternalReady==='true');
              assert.equal(await page.locator('body').getAttribute('data-vira-internal'),key);
              assert.equal(await page.locator(`${navSelector} a[aria-current="page"]`).getAttribute('href'),route);
            }
            console.log(`${mode} cross-page navigation: 6/6 ok`); await page.close();
          }

          {
            const page=await browser.newPage({viewport:{width:390,height:844}});
            await page.goto('http://127.0.0.1:4173/guias.html',{waitUntil:'networkidle'});
            await page.waitForFunction(()=>document.documentElement.dataset.viraInternalReady==='true');
            const boxes=await page.evaluate(()=>{
              const hero=document.querySelector('[data-internal-hero="true"]');
              const outer=hero.querySelector('div.relative:not(.absolute)');
              const nodes={content:outer.querySelector(':scope > .pointer-events-auto'),kicker:hero.querySelector('.vira-hero-kicker'),h1:hero.querySelector('.vira-hero-heading'),copy:hero.querySelector('.vira-hero-copy')};
              return Object.fromEntries(Object.entries(nodes).map(([k,el])=>{const r=el.getBoundingClientRect();return [k,{left:r.left,right:r.right,width:r.width}];}));
            });
            for(const [name,r] of Object.entries(boxes)){assert(r.left>=15,`Guias ${name} left`);assert(r.right<=375,`Guias ${name} right ${r.right}`);assert(r.width<=360,`Guias ${name} width ${r.width}`);}
            console.log('Guias 390px functional hero containment: ok'); await page.close();
          }
          console.log(`system smoke total: ${smokeCount}/18`);
          await browser.close();
          EOF
          node final-system-review-v3.mjs
          rm -f final-system-review-v3.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: final-system-homologation-v3
          path: system-review-v3/*.png
          retention-days: 1
      - name: Clean QA runtime and prove workspace is clean
        run: |
          set -euo pipefail
          rm -rf system-review-v3 node_modules package-lock.json package.json final-system-review-v3.mjs
          test -z "$(git status --porcelain)"
