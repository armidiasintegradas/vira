name: Brandbook mobile RED

on:
  push:
    branches:
      - feat/internal-pages-visual-unity
    paths:
      - .github/workflows/brandbook-mobile-red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/internal-pages-visual-unity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove Brandbook mobile contract is RED
        run: node --test tests/brandbook-page.test.mjs
