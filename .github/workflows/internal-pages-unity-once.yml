name: Internal pages visual unity one-shot

on:
  push:
    branches:
      - feat/internal-pages-visual-unity

permissions:
  contents: write

jobs:
  red-contract:
    if: github.event.head_commit.message == 'test run internal pages red phase'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify contract is red before implementation
        run: node --test tests/internal-pages-visual-unity.test.mjs

  apply-and-verify:
    if: github.event.head_commit.message == 'chore execute internal pages visual unity migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/internal-pages-visual-unity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic internal-page integration
        run: node scripts/apply-internal-pages-unity.mjs
      - name: Run visual-unity contract
        run: node --test tests/internal-pages-visual-unity.test.mjs
      - name: Run focused internal-page regression tests
        shell: bash
        run: |
          set -e
          for f in tests/paver*.test.mjs tests/blocos*.test.mjs tests/guias*.test.mjs tests/central*.test.mjs tests/passaporte*.test.mjs tests/brandbook*.test.mjs; do
            if [ -f "$f" ]; then node --test "$f"; fi
          done
      - name: Run full static test suite
        run: node --test tests/*.test.mjs
      - name: Remove one-shot tooling and commit generated integration
        shell: bash
        run: |
          rm -f .github/workflows/internal-pages-unity-once.yml scripts/apply-internal-pages-unity.mjs .internal-pages-red .internal-pages-migrate
          git config user.name "AR Mídias Integradas Automation"
          git config user.email "armidiasintegradas@users.noreply.github.com"
          git add -A
          git commit -m "feat: unify VIRA internal pages visual system [skip ci]"
          git push origin HEAD:feat/internal-pages-visual-unity
