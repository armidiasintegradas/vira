name: Brandbook mobile final verification v2

on:
  push:
    branches:
      - feat/internal-pages-visual-unity
    paths:
      - .github/workflows/brandbook-mobile-finalize-v2.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/internal-pages-visual-unity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove temporary finalizer and publish clean head
        run: |
          set -euo pipefail
          rm -f .github/workflows/brandbook-mobile-finalize-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: clean Brandbook final QA harness"
          git push origin HEAD:feat/internal-pages-visual-unity
          test -z "$(git status --porcelain)"
      - name: Run complete static suite
        run: node --test tests/*.test.mjs
      - name: Install Chromium QA runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify Brandbook responsive geometry and six-page smoke
        run: |
          set -euo pipefail
          mkdir -p visual-review
          python3 -m http.server 4173 >/tmp/vira-brandbook-final-v2.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          cat > verify-brandbook-final-v2.mjs <<'EOF'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const browser=await chromium.launch({headless:true});
          const brandbookCases=[
            ['desktop',1440,900],
            ['tablet',1024,768],
            ['mobile',390,844],
            ['mobile-narrow',350,780],
          ];
          const chapterIds=['visao-geral','logotipo','cores','tipografia','sinalizacao','uniformes','downloads'];
          for (const [name,width,height] of brandbookCases) {
            const page=await browser.newPage({viewport:{width,height}});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:4173/brandbook.html',{waitUntil:'networkidle',timeout:30000});
            await page.waitForFunction(() => document.documentElement.dataset.viraInternalReady === 'true',null,{timeout:10000});
            const state=await page.evaluate(()=>{
              const nav=document.querySelector('[data-purpose="brandbook-chapter-nav"]');
              const typo=document.querySelector('[data-purpose="brand-typography"] .overflow-x-auto');
              const navAfter=nav?getComputedStyle(nav,'::after'):null;
              const typoBefore=typo?getComputedStyle(typo,'::before'):null;
              const typoAfter=typo?getComputedStyle(typo,'::after'):null;
              return {
                noOverflow:document.documentElement.scrollWidth<=innerWidth,
                scrollWidth:document.documentElement.scrollWidth,
                innerWidth,
                navClient:nav?.clientWidth??0,
                navScroll:nav?.scrollWidth??0,
                navAfterContent:navAfter?.content??null,
                navAfterPosition:navAfter?.position??null,
                typoClient:typo?.clientWidth??0,
                typoScroll:typo?.scrollWidth??0,
                typoBeforeContent:typoBefore?.content??null,
                typoAfterBackground:typoAfter?.backgroundImage??null,
              };
            });
            assert.equal(errors.length,0,`${name}: page errors ${errors.join(' | ')}`);
            assert(state.noOverflow,`${name}: overflow horizontal global ${state.scrollWidth}/${state.innerWidth}`);
            if (width<=639) {
              assert(state.navScroll>state.navClient,`${name}: capítulos sem overflow horizontal esperado`);
              assert(state.navAfterContent?.includes('→'),`${name}: seta capitular ausente`);
              assert.equal(state.navAfterPosition,'sticky',`${name}: seta capitular não sticky`);
              assert(state.typoScroll>state.typoClient,`${name}: tabela tipográfica sem overflow esperado`);
              assert(state.typoBeforeContent?.includes('DESLIZE'),`${name}: DESLIZE ausente`);
              assert(state.typoAfterBackground?.includes('linear-gradient'),`${name}: fade tipográfico ausente`);
            }
            console.log(`brandbook ${name}: ok`,JSON.stringify(state));
            if (name==='mobile') {
              await page.locator('[data-purpose="brandbook-chapter-nav"]').screenshot({path:'visual-review/brandbook-mobile-chapters-after.png'});
              await page.locator('[data-purpose="brand-typography"]').screenshot({path:'visual-review/brandbook-mobile-typography-after.png'});
              for (const id of chapterIds) {
                await page.locator(`[data-purpose="brandbook-chapter-nav"] a[href="#${id}"]`).click();
                await page.waitForTimeout(1500);
                const anchor=await page.evaluate(targetId=>{
                  const target=document.getElementById(targetId);
                  const heading=target?.querySelector('h1,h2,h3');
                  const chapter=document.querySelector('[data-purpose="brandbook-chapter-nav"]');
                  const hr=heading?.getBoundingClientRect();
                  const cr=chapter?.getBoundingClientRect();
                  return {hash:location.hash,headingTop:hr?.top??null,chapterBottom:cr?.bottom??null};
                },id);
                assert.equal(anchor.hash,`#${id}`,`mobile/${id}: hash incorreto`);
                assert(anchor.headingTop!==null&&anchor.chapterBottom!==null,`mobile/${id}: geometria ausente`);
                assert(anchor.headingTop>=anchor.chapterBottom,`mobile/${id}: título coberto`);
                console.log(`anchor mobile/${id}: ok`,JSON.stringify(anchor));
              }
            }
            await page.close();
          }

          const pages=['paver.html','blocos.html','guias.html','central-tecnica.html','passaporte.html','brandbook.html'];
          const smokeCases=[['desktop',1440,900],['tablet',1024,768],['mobile',390,844]];
          let smokeCount=0;
          for (const [name,width,height] of smokeCases) {
            let canonical=null;
            for (const file of pages) {
              const page=await browser.newPage({viewport:{width,height}});
              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              await page.goto(`http://127.0.0.1:4173/${file}`,{waitUntil:'networkidle',timeout:30000});
              await page.waitForFunction(() => document.documentElement.dataset.viraInternalReady === 'true',null,{timeout:10000});
              const s=await page.evaluate(()=>{
                const h=document.querySelector('[data-purpose="primary-navigation"]')?.getBoundingClientRect();
                return {noOverflow:document.documentElement.scrollWidth<=innerWidth,header:h?{top:Math.round(h.top),height:Math.round(h.height),width:Math.round(h.width)}:null};
              });
              assert.equal(errors.length,0,`${name}/${file}: page errors ${errors.join(' | ')}`);
              assert(s.noOverflow,`${name}/${file}: overflow horizontal global`);
              assert(s.header,`${name}/${file}: header ausente`);
              if (!canonical) canonical=s.header;
              else assert.deepEqual(s.header,canonical,`${name}/${file}: header divergiu`);
              smokeCount++;
              console.log(`smoke ${name}/${file}: ok`,JSON.stringify(s.header));
              await page.close();
            }
          }
          assert.equal(smokeCount,18,'smoke deve cobrir 18 combinações');
          console.log(`smoke total: ${smokeCount}/18`);
          await browser.close();
          EOF
          node verify-brandbook-final-v2.mjs
          rm -f verify-brandbook-final-v2.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: brandbook-mobile-after
          path: visual-review/*.png
          retention-days: 1
      - name: Clean QA runtime and prove workspace is clean
        run: |
          set -euo pipefail
          rm -rf visual-review node_modules package-lock.json package.json verify-brandbook-final-v2.mjs
          test -z "$(git status --porcelain)"
