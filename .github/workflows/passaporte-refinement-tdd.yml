name: Passaporte DPP refinement TDD

on:
  push:
    branches:
      - feat/internal-pages-visual-unity
    paths:
      - tests/passaporte.test.mjs
      - passaporte.html
      - internal-pages.css
      - .github/workflows/passaporte-refinement-tdd.yml

permissions:
  contents: read

jobs:
  passaporte-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/internal-pages-visual-unity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Passaporte DPP contract
        run: node --test tests/passaporte.test.mjs
