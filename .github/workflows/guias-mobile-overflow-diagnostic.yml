name: Guias mobile overflow diagnostic

on:
  push:
    branches:
      - feat/internal-pages-visual-unity
    paths:
      - .github/workflows/guias-mobile-overflow-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/internal-pages-visual-unity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove diagnostic workflow and publish clean head
        run: |
          set -euo pipefail
          rm -f .github/workflows/guias-mobile-overflow-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: clean Guias overflow diagnostic harness"
          git push origin HEAD:feat/internal-pages-visual-unity
          test -z "$(git status --porcelain)"
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Diagnose 390px hero overflow
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/guias-overflow.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          cat > diagnose-guias-overflow.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:390,height:844}});
          await page.goto('http://127.0.0.1:4173/guias.html',{waitUntil:'networkidle'});
          await page.waitForFunction(()=>document.documentElement.dataset.viraInternalReady==='true');
          const data = await page.evaluate(()=>{
            const hero=document.querySelector('[data-internal-hero="true"]');
            const all=[hero,...hero.querySelectorAll('*')];
            const offenders=all.map((el,i)=>{
              const r=el.getBoundingClientRect();
              const cs=getComputedStyle(el);
              return {
                i,
                tag:el.tagName.toLowerCase(),
                id:el.id||'',
                cls:typeof el.className==='string'?el.className:'',
                text:(el.textContent||'').trim().replace(/\s+/g,' ').slice(0,90),
                left:+r.left.toFixed(2),right:+r.right.toFixed(2),width:+r.width.toFixed(2),
                clientWidth:el.clientWidth,scrollWidth:el.scrollWidth,
                display:cs.display,position:cs.position,
                widthCSS:cs.width,minWidth:cs.minWidth,maxWidth:cs.maxWidth,
                paddingLeft:cs.paddingLeft,paddingRight:cs.paddingRight,
                overflowX:cs.overflowX,whiteSpace:cs.whiteSpace,
                boxSizing:cs.boxSizing,
                transform:cs.transform,
              };
            }).filter(x=>x.right>390.5||x.left<-.5||x.width>390.5||x.scrollWidth>x.clientWidth+1);
            const heroRect=hero.getBoundingClientRect();
            return {
              viewport:{innerWidth,docScrollWidth:document.documentElement.scrollWidth,bodyScrollWidth:document.body.scrollWidth},
              hero:{left:heroRect.left,right:heroRect.right,width:heroRect.width,clientWidth:hero.clientWidth,scrollWidth:hero.scrollWidth,overflowX:getComputedStyle(hero).overflowX},
              offenders
            };
          });
          console.log(JSON.stringify(data,null,2));
          await browser.close();
          EOF
          node diagnose-guias-overflow.mjs
          rm -rf node_modules package-lock.json package.json diagnose-guias-overflow.mjs
          test -z "$(git status --porcelain)"
