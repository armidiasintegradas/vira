name: Guias mobile apply
on:
  push:
    branches: [feat/internal-pages-visual-unity]
permissions:
  contents: write
jobs:
  apply:
    if: "${{ startsWith(github.event.head_commit.message, 'test: prepare Guias mobile GREEN') }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/internal-pages-visual-unity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply approved Guias mobile refinement
        shell: bash
        run: |
          set -euo pipefail
          cat >> internal-pages.css <<'EOF'

          /* Guias mobile visual review refinement */
          @media (min-width:360px) and (max-width:639px) {
            [data-vira-internal="guias"] [data-internal-hero="true"] > div.relative:not(.absolute) > div.mt-14 {
              grid-template-columns:repeat(2,minmax(0,1fr));
            }
          }

          @media (max-width:639px) {
            [data-vira-internal="guias"] [data-purpose="technical-anatomy"] .lg\:col-span-7.overflow-x-auto {
              position:relative;
              padding-top:26px;
              isolation:isolate;
            }

            [data-vira-internal="guias"] [data-purpose="technical-anatomy"] .lg\:col-span-7.overflow-x-auto::before {
              content:"DESLIZE →";
              position:absolute;
              z-index:4;
              top:0;
              right:2px;
              padding:3px 7px;
              border:1px solid rgba(241,197,70,.28);
              border-radius:999px;
              background:rgba(8,17,13,.88);
              color:var(--vira-gold);
              font-family:"IBM Plex Mono",monospace;
              font-size:9px;
              line-height:1.2;
              font-weight:700;
              letter-spacing:.08em;
              pointer-events:none;
            }

            [data-vira-internal="guias"] [data-purpose="technical-anatomy"] .lg\:col-span-7.overflow-x-auto::after {
              content:"";
              position:absolute;
              z-index:3;
              top:26px;
              right:0;
              bottom:0;
              width:38px;
              background:linear-gradient(to left,rgba(8,17,13,.96),rgba(8,17,13,0));
              pointer-events:none;
            }
          }
          EOF
          node --test tests/guias-page.test.mjs
          git config user.name 'armidiasintegradas'
          git config user.email 'armidiasintegradas@gmail.com'
          git add internal-pages.css
          git commit -m 'fix: refine Guias mobile hero and table affordance'
          git push origin HEAD:feat/internal-pages-visual-unity
