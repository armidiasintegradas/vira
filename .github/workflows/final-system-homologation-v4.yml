name: Final system homologation v4

on:
  push:
    branches:
      - feat/internal-pages-visual-unity
    paths:
      - '.github/workflows/final-system-homologation-v4.yml'

permissions:
  contents: write

jobs:
  homologate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/internal-pages-visual-unity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove temporary workflow and publish clean head
        run: |
          set -euo pipefail
          rm -f .github/workflows/final-system-homologation-v4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: clean final system homologation v4 harness"
          git push origin HEAD:feat/internal-pages-visual-unity
          test -z "$(git status --porcelain)"
      - name: Run complete static suite
        run: node --test tests/*.test.mjs
      - name: Install Chromium QA runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run final browser homologation
        run: |
          set -euo pipefail
          mkdir -p system-review-v4
          python3 -m http.server 4173 >/tmp/vira-final-system-v4.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          cat > final-system-review-v4.mjs <<'EOF'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch({headless:true});
          const routes=[['paver','paver.html'],['blocos','blocos.html'],['guias','guias.html'],['central-tecnica','central-tecnica.html'],['passaporte','passaporte.html'],['brandbook','brandbook.html']];
          const expectedRoutes=routes.map(([,r])=>r);
          const viewports=[['desktop',1440,900],['tablet',1024,768],['mobile',390,844]];
          let smokeCount=0;
          for(const [viewportName,width,height] of viewports){
            let canonicalHeader=null,canonicalTelemetry=null,canonicalFooter=null;
            for(const [key,route] of routes){
              const page=await browser.newPage({viewport:{width,height}}); const pageErrors=[]; page.on('pageerror',e=>pageErrors.push(e.message));
              await page.goto(`http://127.0.0.1:4173/${route}`,{waitUntil:'networkidle',timeout:30000});
              await page.waitForFunction(()=>document.documentElement.dataset.viraInternalReady==='true',null,{timeout:10000});
              const s=await page.evaluate(({key})=>{
                const header=document.querySelector('[data-purpose="primary-navigation"]'); const telemetry=document.querySelector('[data-purpose="telemetry-bar"]'); const footer=document.querySelector('[data-purpose="internal-footer"]');
                const desktopNav=header?.querySelector('.vira-product-switcher'); const mobileDrawer=header?.querySelector('.vira-mobile-drawer'); const menuToggle=header?.querySelector('.vira-menu-toggle');
                const hr=header?.getBoundingClientRect(),tr=telemetry?.getBoundingClientRect(),fr=footer?.getBoundingClientRect();
                const da=[...(desktopNav?.querySelectorAll('a[aria-current="page"]')??[])],ma=[...(mobileDrawer?.querySelectorAll('a[aria-current="page"]')??[])],fa=[...(footer?.querySelectorAll('a[aria-current="page"]')??[])];
                const config=window.VIRAInternalPages?.PAGE_CONFIG?.[key];
                return {bodyKey:document.body.dataset.viraInternal,ready:document.documentElement.dataset.viraInternalReady,noOverflow:document.documentElement.scrollWidth<=innerWidth,canonicalTelemetry:telemetry?.dataset.viraCanonical??null,
                  da:da.length,dah:da[0]?.getAttribute('href')??null,ma:ma.length,mah:ma[0]?.getAttribute('href')??null,fa:fa.length,fah:fa[0]?.getAttribute('href')??null,
                  desktopRoutes:[...(desktopNav?.querySelectorAll('.vira-nav-link')??[])].map(a=>a.getAttribute('href')),mobileRoutes:[...(mobileDrawer?.querySelectorAll('.vira-nav-link')??[])].map(a=>a.getAttribute('href')),footerRoutes:[...(footer?.querySelectorAll('.vira-internal-footer__links a')??[])].map(a=>a.getAttribute('href')),navRoutes:window.VIRAInternalPages?.NAV?.map(x=>x.route)??[],
                  headerLogo:header?.querySelector('.vira-brand__logo')?.getAttribute('src')??'',footerLogo:footer?.querySelector('.vira-internal-footer__logo')?.getAttribute('src')??'',headerCta:header?.querySelector('.vira-header-actions .vira-specify-cta')?.getAttribute('href')??'',drawerCta:mobileDrawer?.querySelector('.vira-specify-cta')?.getAttribute('href')??'',telemetryCta:telemetry?.querySelector('.vira-telemetry__cta')?.getAttribute('href')??'',configCta:config?.cta??null,localAnchorExists:config?.cta?.startsWith('#')?Boolean(document.querySelector(config.cta)):true,footerCredit:footer?.textContent.includes('Desenvolvido por AR Mídias Integradas.')??false,
                  headerRect:hr?{top:Math.round(hr.top),width:Math.round(hr.width),height:Math.round(hr.height)}:null,telemetryRect:tr?{top:Math.round(tr.top),width:Math.round(tr.width),height:Math.round(tr.height)}:null,footerRect:fr?{width:Math.round(fr.width),height:Math.round(fr.height)}:null,
                  desktopVisible:desktopNav?getComputedStyle(desktopNav).display!=='none':false,menuVisible:menuToggle?getComputedStyle(menuToggle).display!=='none':false,drawerHidden:mobileDrawer?.getAttribute('aria-hidden')??null};
              },{key});
              assert.equal(pageErrors.length,0,`${viewportName}/${route}: page errors`); assert.equal(s.bodyKey,key); assert.equal(s.ready,'true'); assert(s.noOverflow); assert.equal(s.canonicalTelemetry,'true');
              assert.equal(s.da,1);assert.equal(s.dah,route);assert.equal(s.ma,1);assert.equal(s.mah,route);assert.equal(s.fa,1);assert.equal(s.fah,route);
              assert.deepEqual(s.desktopRoutes,expectedRoutes);assert.deepEqual(s.mobileRoutes,expectedRoutes);assert.deepEqual(s.footerRoutes,expectedRoutes);assert.deepEqual(s.navRoutes,expectedRoutes);
              assert(s.headerLogo.endsWith('assets/marca-site-menu.webp'));assert(s.footerLogo.endsWith('assets/marca-site-menu.webp'));assert.equal(s.headerCta,s.configCta);assert.equal(s.drawerCta,s.configCta);assert.equal(s.telemetryCta,s.configCta);assert(s.localAnchorExists);assert(s.footerCredit);
              if(!canonicalHeader)canonicalHeader=s.headerRect;else assert.deepEqual(s.headerRect,canonicalHeader); if(!canonicalTelemetry)canonicalTelemetry=s.telemetryRect;else assert.deepEqual(s.telemetryRect,canonicalTelemetry); if(!canonicalFooter)canonicalFooter=s.footerRect;else assert.deepEqual(s.footerRect,canonicalFooter);
              if(width>=1280){assert(s.desktopVisible);assert(!s.menuVisible);}else{assert(!s.desktopVisible);assert(s.menuVisible);assert.equal(s.drawerHidden,'true');}
              if(viewportName==='mobile'){const b=page.locator('.vira-menu-toggle'),d=page.locator('.vira-mobile-drawer');await b.click();assert.equal(await b.getAttribute('aria-expanded'),'true');assert.equal(await d.getAttribute('aria-hidden'),'false');await page.keyboard.press('Escape');assert.equal(await b.getAttribute('aria-expanded'),'false');assert.equal(await d.getAttribute('aria-hidden'),'true');}
              if(viewportName==='desktop')await page.screenshot({path:`system-review-v4/${key}-desktop-top.png`,clip:{x:0,y:0,width,height:900}}); if(viewportName==='mobile')await page.screenshot({path:`system-review-v4/${key}-mobile-top.png`,clip:{x:0,y:0,width,height:844}});
              smokeCount++;console.log(`system ${viewportName}/${route}: ok`,JSON.stringify({header:s.headerRect,telemetry:s.telemetryRect,footer:s.footerRect}));await page.close();
            }
          }
          assert.equal(smokeCount,18);
          for(const [mode,width,height,nav] of [['desktop',1440,900,'.vira-product-switcher'],['mobile',390,844,'.vira-mobile-drawer']]){const page=await browser.newPage({viewport:{width,height}});await page.goto('http://127.0.0.1:4173/paver.html',{waitUntil:'networkidle'});await page.waitForFunction(()=>document.documentElement.dataset.viraInternalReady==='true');for(const [key,route] of routes.slice(1).concat([routes[0]])){if(mode==='mobile')await page.locator('.vira-menu-toggle').click();await Promise.all([page.waitForURL(u=>u.pathname.endsWith(`/${route}`),{timeout:10000}),page.locator(`${nav} a[href="${route}"]`).click()]);await page.waitForFunction(()=>document.documentElement.dataset.viraInternalReady==='true');assert.equal(await page.locator('body').getAttribute('data-vira-internal'),key);assert.equal(await page.locator(`${nav} a[aria-current="page"]`).getAttribute('href'),route);}console.log(`${mode} cross-page navigation: 6/6 ok`);await page.close();}
          {const page=await browser.newPage({viewport:{width:390,height:844}});await page.goto('http://127.0.0.1:4173/guias.html',{waitUntil:'networkidle'});await page.waitForFunction(()=>document.documentElement.dataset.viraInternalReady==='true');const boxes=await page.evaluate(()=>{const hero=document.querySelector('[data-internal-hero="true"]'),outer=hero.querySelector('div.relative:not(.absolute)');const nodes={content:outer.querySelector(':scope > .pointer-events-auto'),kicker:hero.querySelector('.vira-hero-kicker'),h1:hero.querySelector('.vira-hero-heading'),copy:hero.querySelector('.vira-hero-copy')};return Object.fromEntries(Object.entries(nodes).map(([k,el])=>{const r=el.getBoundingClientRect();return[k,{left:r.left,right:r.right,width:r.width}];}));});for(const [name,r] of Object.entries(boxes)){assert(r.left>=15,`Guias ${name} left`);assert(r.right<=375,`Guias ${name} right ${r.right}`);assert(r.width<=360,`Guias ${name} width ${r.width}`);}console.log('Guias 390px functional hero containment: ok');await page.close();}
          console.log(`system smoke total: ${smokeCount}/18`);await browser.close();
          EOF
          node final-system-review-v4.mjs
          rm -f final-system-review-v4.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: final-system-homologation-v4
          path: system-review-v4/*.png
          retention-days: 1
      - name: Clean QA runtime and prove workspace is clean
        run: |
          set -euo pipefail
          rm -rf system-review-v4 node_modules package-lock.json package.json final-system-review-v4.mjs
          test -z "$(git status --porcelain)"
